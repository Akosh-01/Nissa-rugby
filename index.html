function computeInjuryStats(injuries,roster){
  const total=injuries.length;
  const ongoing=injuries.filter(isInjuryOngoing).length;
  const durations=injuries.map(x=>computeInjuryDuration(x)).filter(v=>v!==null&&v>0);
  const avgDuration=durations.length?(durations.reduce((a,b)=>a+b,0)/durations.length):null;
  const grave=injuries.filter(x=>(x.gravite||'').toLowerCase().includes('grave')).length;

  function counter(field){
    const m={};
    injuries.forEach(x=>{const v=(x[field]||'(vide)').trim()||'(vide)';m[v]=(m[v]||0)+1;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }
  const byTypo=counter('typo');
  const byType=counter('type');
  const byLoc=counter('loc');
  const byPoste=counter('poste');
  const byPlayer=counter('nom');
  const byMoment=counter('lieu');

  // Par mois (à partir de la date, format YYYY-MM-DD)
  const byMonth={};
  injuries.forEach(x=>{
    if(!x.date)return;
    const d=new Date(x.date);
    if(isNaN(d))return;
    const key=d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
    byMonth[key]=(byMonth[key]||0)+1;
  });
  const monthEntries=Object.entries(byMonth).sort((a,b)=>{
    const da=injuries.find(x=>x.date&&new Date(x.date).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})===a[0]);
    const db=injuries.find(x=>x.date&&new Date(x.date).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})===b[0]);
    return new Date(da?.date||0)-new Date(db?.date||0);
  });

  // Trouve le joueur du roster correspondant à une ligne de blessure (nom + génération compatible)
  function findRosterPlayer(x){
    if(!roster)return null;
    const xGen=parseInt(x.gen)||null;
    return roster.find(p=>{
      const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
      if(!nameMatches)return false;
      if(xGen&&p.gen&&xGen!==p.gen)return false;
      return true;
    });
  }

  // Taux de blessure par génération (% de l'effectif de chaque génération ayant eu au moins une blessure)
  let byGenRate=[];
  if(roster&&roster.length){
    const genGroups={};
    roster.forEach(p=>{
      const g=p.gen||'?';
      if(!genGroups[g])genGroups[g]={total:0,injured:new Set()};
      genGroups[g].total++;
    });
    injuries.forEach(x=>{
      const p=findRosterPlayer(x);
      const g=p?(p.gen||'?'):(parseInt(x.gen)||'?');
      if(genGroups[g])genGroups[g].injured.add(canonicalNameKey(x.nom));
    });
    byGenRate=Object.entries(genGroups)
      .map(([g,v])=>[`Génération ${g}`,v.total?Math.round(v.injured.size/v.total*100):0,v.injured.size,v.total])
      .sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  }

  // Taux de blessure Avants vs 3/4 (% de chaque groupe de postes ayant eu au moins une blessure)
  let byPosGroupRate=[];
  if(roster&&roster.length){
    const isForward=isForwardPos,isBack=isBackPos;
    const groups={'Avants':{total:0,injured:new Set()},'3/4':{total:0,injured:new Set()}};
    roster.forEach(p=>{
      if(isForward(p))groups['Avants'].total++;
      else if(isBack(p))groups['3/4'].total++;
    });
    injuries.forEach(x=>{
      const p=findRosterPlayer(x);
      if(!p)return;
      if(isForward(p))groups['Avants'].injured.add(canonicalNameKey(x.nom));
      else if(isBack(p))groups['3/4'].injured.add(canonicalNameKey(x.nom));
    });
    byPosGroupRate=Object.entries(groups)
      .map(([label,v])=>[label,v.total?Math.round(v.injured.size/v.total*100):0,v.injured.size,v.total]);
  }

  // Récidive : joueurs blessés plusieurs fois (peu importe la localisation)
  const countByPlayerKey={};
  injuries.forEach(x=>{const k=canonicalNameKey(x.nom);countByPlayerKey[k]=(countByPlayerKey[k]||0)+1;});
  const nbJoueursTouches=Object.keys(countByPlayerKey).length;
  const nbRecidivistes=Object.values(countByPlayerKey).filter(n=>n>1).length;

  // Durée moyenne d'absence PAR typologie (pas juste une moyenne globale)
  const durByTypo={};
  injuries.forEach(x=>{
    const d=computeInjuryDuration(x);
    if(d===null||d<=0)return;
    const k=(x.typo||'(vide)').trim()||'(vide)';
    if(!durByTypo[k])durByTypo[k]={sum:0,n:0};
    durByTypo[k].sum+=d;durByTypo[k].n++;
  });
  const avgDurationByTypo=Object.entries(durByTypo)
    .map(([label,v])=>[label,Math.round(v.sum/v.n),v.n])
    .sort((a,b)=>b[1]-a[1]);

  // Cumul total de jours d'absence de l'équipe (pas la moyenne — l'impact collectif réel)
  const totalAbsenceDays=durations.reduce((a,b)=>a+b,0);

  // Taux de disponibilité de l'effectif actuel (% de joueurs du roster actuellement aptes)
  let dispoRate=null,dispoCount=null,dispoTotal=null;
  if(roster&&roster.length){
    dispoTotal=roster.length;
    dispoCount=roster.filter(p=>getPlayerInjuryStatus(p.name,p.gen)==='disponible').length;
    dispoRate=Math.round(dispoCount/dispoTotal*100);
  }

  return{total,ongoing,avgDuration,grave,byTypo,byType,byLoc,byPoste,byPlayer,byMoment,monthEntries,byGenRate,byPosGroupRate,nbJoueursTouches,nbRecidivistes,avgDurationByTypo,totalAbsenceDays,dispoRate,dispoCount,dispoTotal};
}

// Ratio blessures rapporté au volume réel de séances (entraînements/matchs du calendrier),
// pour comparer le risque par séance plutôt que le nombre brut d'événements.
// Reconstitue le % de l'effectif disponible semaine par semaine depuis une date de départ,
// en se basant sur les plages date de blessure -> date de retour de chaque blessure.
// Une blessure sans date de retour est considérée active jusqu'à aujourd'hui (ou jusqu'à la fin de saison analysée).
function computeWeeklyAvailability(roster,allInjuriesForRoster,startDateStr,catName){
  if(!roster||!roster.length)return[];
  const start=new Date(startDateStr);
  const today=new Date();today.setHours(0,0,0,0);
  if(isNaN(start))return[];
  // Veille de la reprise : sert de point de départ pour un joueur "arrivé blessé" sans date connue
  // (il était déjà indisponible dès le premier jour, donc avant même le lundi de la semaine 1).
  const beforeStart=new Date(start);beforeStart.setDate(beforeStart.getDate()-1);

  // Associe chaque blessure à son joueur du roster (nom + génération compatible)
  function findPlayer(x){
    const xGen=parseInt(x.gen)||null;
    return roster.find(p=>{
      const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
      if(!nameMatches)return false;
      if(xGen&&p.gen&&xGen!==p.gen)return false;
      return true;
    });
  }
  // Plages [début,fin] d'indisponibilité par joueur (id du roster).
  // Contrairement aux autres statistiques (typologie, taux par génération...) qui excluent
  // volontairement les "Arrivé blessé" (pour ne pas polluer l'analyse des blessures survenues au club),
  // la disponibilité réelle de l'effectif doit, elle, les INCLURE : un joueur arrivé blessé était
  // bel et bien indisponible dès le début, peu importe la cause — et même sans date de blessure
  // renseignée (le cas le plus fréquent pour ce statut, étape parfois vide plutôt que remplie
  // explicitement), on le compte indisponible depuis la reprise dès lors qu'il est actuellement
  // classé comme blessé/en réhabilitation (isInjuryOngoing), pas seulement si le texte exact
  // "arrivé blessé" est présent dans Étape. Le % = (effectif total - blessés - en réhab) / effectif total.
  const rangesByPlayer={};
  let dbgTotal=0,dbgNoDateSkipped=0,dbgNoPlayerMatch=0,dbgBuilt=0;
  allInjuriesForRoster.forEach(x=>{
    dbgTotal++;
    const stillOngoing=isInjuryOngoing(x);
    if(!x.date&&!stillOngoing){dbgNoDateSkipped++;return;}
    const p=findPlayer(x);
    if(!p){dbgNoPlayerMatch++;return;}
    const key=p.id;
    const d0=x.date?new Date(x.date):new Date(beforeStart);
    if(isNaN(d0))return;
    const d1=x.retour&&!isNaN(new Date(x.retour))?new Date(x.retour):today;
    const status=injuryStepStatus(x); // 'blesse' ou 'rehabilitation' — pour distinguer les deux dans l'infobulle
    if(!rangesByPlayer[key])rangesByPlayer[key]=[];
    rangesByPlayer[key].push([d0,d1,status]);
    dbgBuilt++;
  });
  window._weeklyAvailDebug={dbgTotal,dbgNoDateSkipped,dbgNoPlayerMatch,dbgBuilt,sample:allInjuriesForRoster.slice(0,3).map(x=>({nom:x.nom,gen:x.gen,date:x.date,etape:x.etape,retour:x.retour,source:x.source}))};

  // Parse une date DD/MM/YYYY du calendrier (adminEvents) vers un objet Date
  function parseEvDate(d){
    const m=String(d||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(!m)return null;
    return new Date(`${m[3]}-${m[2]}-${m[1]}`);
  }

  // Instantané de chaque semaine au LUNDI (début de semaine) : un joueur compte comme indisponible
  // cette semaine-là seulement s'il l'était DÉJÀ strictement avant ce lundi (et pas encore revenu).
  // Une blessure survenant PENDANT une semaine (n'importe quel jour, y compris en fin de semaine)
  // ne compte donc qu'à partir de la semaine SUIVANTE — jamais la semaine où elle est survenue.
  const weeks=[];
  let weekStart=new Date(start);
  while(weekStart<=today){
    const weekEndReal=new Date(weekStart);weekEndReal.setDate(weekEndReal.getDate()+6); // dimanche réel (affichage/matchs uniquement)
    const blessesNames=[],rehabNames=[];
    roster.forEach(p=>{
      const ranges=rangesByPlayer[p.id]||[];
      const active=ranges.find(([d0,d1])=>d0<weekStart&&d1>weekStart);
      if(active){
        if(active[2]==='rehabilitation')rehabNames.push(p.name);
        else blessesNames.push(p.name);
      }
    });
    const unavailableNames=[...blessesNames,...rehabNames];
    const unavailable=unavailableNames.length;
    const pct=roster.length?+(( (roster.length-unavailable)/roster.length*100 ).toFixed(1)):100;
    const pctDisplay=pct.toFixed(1).replace('.',',');

    // Match de la semaine (s'il y en a un), pour afficher l'adversaire au-dessus du point
    const weekMatch=(adminEvents||[]).find(e=>{
      if(e.type!=='match')return false;
      if(catName&&e.cat!==catName&&e.cat!=='Tous')return false;
      const d=parseEvDate(e.date);
      return d&&d>=weekStart&&d<=weekEndReal;
    });

    weeks.push({
      label:`${weekStart.getDate()}/${weekStart.getMonth()+1}`,
      pct,pctDisplay,unavailable,total:roster.length,unavailableNames,blessesNames,rehabNames,
      opponent:weekMatch?parseMatchEvent(weekMatch).opponent:null,
      isCurrent:weekEndReal>=today
    });
    weekStart.setDate(weekStart.getDate()+7);
  }
  return weeks;
}

function computeVolumeRates(injuries,catName){
  const parseEvDate=d=>{
    const m=String(d||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(!m)return null;
    return`${m[3]}-${m[2]}-${m[1]}`;
  };
  const teamEvents=adminEvents.filter(e=>{
    if(e.cat!==catName&&e.cat!=='Tous')return false;
    const d=parseEvDate(e.date);
    return d&&d>=SEASON_START_DATE;
  });
  const nbMatchs=teamEvents.filter(e=>e.type==='match').length;
  const nbEntrainements=teamEvents.filter(e=>e.type==='training').length;
  const injMatch=injuries.filter(x=>normAccent(x.lieu).includes('match')).length;
  const injEntrainement=injuries.filter(x=>normAccent(x.lieu).includes('entrainement')).length;
  return{
    nbMatchs,nbEntrainements,injMatch,injEntrainement,
    tauxMatch:nbMatchs?+(injMatch/nbMatchs).toFixed(2):null,
    tauxEntrainement:nbEntrainements?+(injEntrainement/nbEntrainements).toFixed(2):null,
  };
}

// ── Graphiques SVG génériques (barres horizontales, camembert) ──
function svgHBarChart(data,opts={}){
  const{maxItems=10,unit='',showPercent=false}=opts;
  const items=data.slice(0,maxItems);
  const total=data.reduce((s,[,v])=>s+v,0);
  const max=Math.max(...items.map(([,v])=>v),1);
  return`<div>
    ${items.map(([label,val])=>{
      const pct=(val/max*100).toFixed(0);
      const pctOfTotal=total?((val/total)*100).toFixed(1):0;
      return`<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:3px;">
          <span>${label}</span>
          <span style="font-weight:700;color:var(--text);">${val}${showPercent?` (${pctOfTotal}%)`:''}</span>
        </div>
        <div style="background:var(--surface2);border-radius:5px;height:9px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:var(--primary);border-radius:5px;"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function svgPieChart(data,opts={}){
  const total=data.reduce((s,[,v])=>s+v,0)||1;
  const colors=['var(--primary)','var(--ink)','var(--ink-soft)','var(--primary-dark)','#888','#bbb'];
  const R=60,cx=70,cy=70;
  let angle=-90;
  const slices=data.map(([label,val],i)=>{
    const frac=val/total;
    const a0=angle;
    angle+=frac*360;
    const a1=angle;
    const large=(a1-a0)>180?1:0;
    const p0=[cx+R*Math.cos(a0*Math.PI/180),cy+R*Math.sin(a0*Math.PI/180)];
    const p1=[cx+R*Math.cos(a1*Math.PI/180),cy+R*Math.sin(a1*Math.PI/180)];
    const path=`M${cx},${cy} L${p0[0]},${p0[1]} A${R},${R} 0 ${large} 1 ${p1[0]},${p1[1]} Z`;
    return{path,color:colors[i%colors.length],label,val,pct:(frac*100).toFixed(0)};
  });
  return`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex-shrink:0;">
      ${slices.map(s=>`<path d="${s.path}" fill="${s.color}"/>`).join('')}
    </svg>
    <div style="flex:1;min-width:120px;">
      ${slices.map(s=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
        <div style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0;"></div>
        <span style="font-size:11px;color:var(--text);flex:1;">${s.label}</span>
        <span style="font-size:11px;font-weight:700;color:var(--text);">${s.val} (${s.pct}%)</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function svgLineChart(monthEntries){
  if(!monthEntries.length)return`<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:16px;">Pas assez de données.</div>`;
  const W=320,H=140,padL=24,padR=10,padT=14,padB=22;
  const vals=monthEntries.map(([,v])=>v);
  const max=Math.max(...vals,1);
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const xStep=monthEntries.length>1?innerW/(monthEntries.length-1):0;
  function x(i){return padL+i*xStep;}
  function y(v){return padT+innerH-(v/max)*innerH;}
  let d='';
  monthEntries.forEach(([,v],i)=>{d+=(i===0?'M':'L')+x(i)+','+y(v)+' ';});
  const dots=monthEntries.map(([,v],i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--primary)"/><text x="${x(i)}" y="${y(v)-8}" font-size="9" fill="var(--text)" text-anchor="middle">${v}</text>`).join('');
  const labels=monthEntries.map(([lab],i)=>`<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${lab}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

function bodyNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
// Zone d'une blessure : on lit d'abord la localisation, puis le type si la localisation est inconnue.
function bodyZoneOf(x){
  for(const src of [x.loc,x.type,x.commentaire]){
    const t=bodyNorm(src);
    if(!t)continue;
    const z=BODY_ZONES.find(z=>z.re.test(t));
    if(z)return z;
  }
  return null;
}
// Côté de la blessure : colonne "Côté" si elle existe, sinon "droit/gauche" écrit dans la localisation, le type ou le commentaire.
function injurySide(x){
  const c=bodyNorm(x.cote);
  if(c){
    if(/bilat|deux|les 2/.test(c))return'B';
    if(/^d|droit/.test(c))return'D';
    if(/^g|gauche/.test(c))return'G';
  }
  const t=' '+bodyNorm([x.loc,x.type,x.commentaire].join(' '))
    .replace(/droit (femoral|anterieur|interne|de l.?abdomen)/g,' ')+' ';
  const d=/\b(droit|droite|dte|dt)\b|\(d\)/.test(t), g=/\b(gauche|gche|gch)\b|\(g\)/.test(t);
  if(/bilat/.test(t)||(d&&g))return'B';
  if(d)return'D';
  if(g)return'G';
  return null;
}
function injurySideLabel(s){return s==='D'?'Droit':s==='G'?'Gauche':s==='B'?'Bilatéral':'';}

// Points à dessiner sur une vue ('f' ou 'b') pour une liste de blessures
function bodyMarksFor(view,injuries){
  const out=[];
  injuries.forEach(x=>{
    const z=bodyZoneOf(x);if(!z)return;
    const pt=view==='f'?z.f:z.b;if(!pt)return;
    const side=injurySide(x);
    const cur=isInjuryOngoing(x);
    const [bx,y]=pt;
    let xs;
    if(bx===60)xs=[60];
    else{
      const right=view==='f'?bx:120-bx, left=120-right;
      xs=side==='D'?[right]:side==='G'?[left]:[right,left];
    }
    const tip=`${BODY_ZONE_LABELS[z.k]||x.loc||''}${side?' '+injurySideLabel(side).toLowerCase():''} · ${x.type||'—'}${x.date?' · '+fD(x.date):''}${cur?' (en cours)':''}`;
    xs.forEach(px=>out.push({x:px,y,cur,tip,unsure:!side&&bx!==60}));
  });
  // Les anciennes d'abord, les blessures en cours par-dessus
  return out.sort((a,b)=>(a.cur?1:0)-(b.cur?1:0));
}

// ── Fiches joueurs indisponibles / en réhabilitation (application + PDF) ──
function injuryFindPlayer(x,pool){
  const xGen=parseInt(x.gen)||null;
  const ok=p=>{
    const nm=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
    if(!nm)return false;
    if(xGen&&p.gen&&xGen!==p.gen)return false;
    return true;
  };
  return (pool||[]).find(ok)||ACTIVE_DB.find(ok)||null;
}
// Regroupe les blessures en cours par joueur (une seule fiche par joueur, même avec plusieurs zones)
function groupOngoingByPlayer(injuries,pool,allInjuries){
  const groups=new Map();
  injuries.filter(isInjuryOngoing).forEach(x=>{
    const p=injuryFindPlayer(x,pool);
    const key=p?p.id:'nom:'+canonicalNameKey(x.nom);
    if(!groups.has(key))groups.set(key,{p,nom:x.nom,current:[]});
    groups.get(key).current.push(x);
  });
  const list=[...groups.values()].map(g=>{
    g.current.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    g.status=g.current.some(x=>injuryStepStatus(x)==='blesse')?'blesse':'rehabilitation';
    // Historique complet du joueur (pour les points verts du schéma)
    const src=allInjuries||injuriesDB;
    g.history=src.filter(y=>{
      if(g.p)return injuryFindPlayer(y,[g.p])===g.p;
      return canonicalNameKey(y.nom)===canonicalNameKey(g.nom);
    });
    if(!g.history.length)g.history=g.current.slice();
    g.since=g.current.map(x=>x.date).filter(Boolean).sort()[0]||'';
    return g;
  });
  return list.sort((a,b)=>(a.since||'9').localeCompare(b.since||'9'));
}
function daysSince(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr);if(isNaN(d))return null;
  return Math.max(0,Math.floor((new Date()-d)/86400000));
}

function importInjuriesExcel(e){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('injuryImportStatus');
  if(st)st.innerHTML='<span style="color:var(--text-muted)">⏳ Traitement...</span>';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      let headerIdx=0;
      for(let i=0;i<Math.min(10,allRows.length);i++){
        const rn=allRows[i].map(v=>normHeader(String(v||'')));
        if(rn.some(h=>['nom','noms','name'].includes(h))){headerIdx=i;break;}
      }
      const cm=buildColMap(allRows[headerIdx],INJURY_HEADER_MAP);
      const rows=allRows.slice(headerIdx+1);
      let added=0,skipped=0;
      const newEntries=[];
      for(const row of rows){
        const get=f=>cm[f]>=0?String(row[cm[f]]||'').trim():'';
        const nom=get('nom');
        if(!nom||nom==='Noms'||nom==='(vide)')continue;
        let date=get('date');
        if(date&&date.includes('T'))date=date.slice(0,10);
        else if(date){
          const m=date.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
          if(m)date=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
        }
        let retour=get('retour');
        if(retour&&retour.includes('T'))retour=retour.slice(0,10);
        else if(retour){
          const m2=retour.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
          if(m2)retour=`${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
        }
        const entry={
          id:'inj'+Date.now()+Math.random().toString(36).slice(2,6),
          nom:nom.toUpperCase().trim(),
          gen:get('gen'),poste:get('poste'),
          date,typo:get('typo'),type:get('type'),
          loc:get('loc'),lieu:get('lieu'),
          gravite:get('gravite'),etape:get('etape'),
          duree:get('duree'),retour,
          medical:get('medical'),saison:get('saison'),
          source:'excel'
        };
        const isDupe=injuriesDB.some(x=>x.nom===entry.nom&&x.date===entry.date&&x.type===entry.type&&x.loc===entry.loc);
        if(!isDupe){newEntries.push(entry);added++;}else skipped++;
      }
      injuriesDB=[...injuriesDB,...newEntries];
      saveInjuries();
      if(st)st.innerHTML=`<span style="color:var(--ink);font-weight:600;">✅ ${added} blessure${added>1?'s':''} importée${added>1?'s':''}${skipped?` · ${skipped} doublons ignorés`:''}.</span>`;
      setTimeout(()=>{blessureAdding=false;render();},800);
    }catch(err){if(st)st.innerHTML=`<span style="color:var(--primary-dark);">❌ ${err.message}</span>`;}
  };
  reader.readAsBinaryString(f);
}

function getMonthDateRange(year,month){
  const start=`${year}-${String(month+1).padStart(2,'0')}-01`;
  const lastDay=new Date(year,month+1,0).getDate();
  const end=`${year}-${String(month+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return{start,end};
}
function filterInjuriesByPeriod(allInjuries){
  const base=allInjuries.filter(x=>!x.date||x.date>=SEASON_START_DATE).filter(x=>!normAccent(x.etape).includes('arrive'));

  return base.filter(x=>x.date&&x.date>=start&&x.date<=end);

function generateInjuryReport(){
  const catName=cat||window._ctxCat||'Alamercery';
  let players=ACTIVE_DB.filter(p=>inRosterView(p,catName)).sort(bySurname);
  const broaderPlayers=ACTIVE_DB.filter(p=>{
    const c=p.cat==='Gaudermans'?'Gauderman':p.cat;
    return c===catName;
  });
  const matchPool=[...new Map([...players,...broaderPlayers].map(p=>[p.id,p])).values()];
  const rosterMatch=x=>{
    const xGen=parseInt(x.gen)||null;
    return matchPool.some(p=>{
      const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
      if(!nameMatches)return false;
      if(xGen&&p.gen&&xGen!==p.gen)return false;
      return true;
    });
  };
  const teamInjuries=[...injuriesDB].filter(rosterMatch);
  const seasonInjuries=teamInjuries.filter(x=>!x.date||x.date>=SEASON_START_DATE).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const statsInjuries=seasonInjuries.filter(x=>!normAccent(x.etape).includes('arrive'));
  // Statistiques calculées sur le roster STRICT de la saison (players), jamais sur le pool élargi.
  const s=computeInjuryStats(statsInjuries,players);
  const vol=computeVolumeRates(statsInjuries,catName);
  const arrivedInjured=seasonInjuries.filter(x=>normAccent(x.etape).includes('arrive'));
  const weeklyAvail=computeWeeklyAvailability(players,seasonInjuries,SEASON_START_DATE,catName);

  // État actuel : une fiche par joueur, séparée entre indisponibles et réathlétisation
  const groups=groupOngoingByPlayer(teamInjuries,matchPool,injuriesDB);
  const indispo=groups.filter(g=>g.status==='blesse');
  const reath=groups.filter(g=>g.status!=='blesse');
  const outIds=new Set(groups.filter(g=>g.p&&players.includes(g.p)).map(g=>g.p.id));
  const aptes=Math.max(0,players.length-outIds.size);

  // Mois sélectionné dans la vue Collectif
  initBlessurePeriod();
  const selMonth=blessurePeriodMonth;
  const mm=String(selMonth.month+1).padStart(2,'0');
  const curMonthStart=`${selMonth.year}-${mm}-01`;
  const curMonthEnd=`${selMonth.year}-${mm}-${String(new Date(selMonth.year,selMonth.month+1,0).getDate()).padStart(2,'0')}`;
  const monthInjuries=statsInjuries.filter(x=>x.date&&x.date>=curMonthStart&&x.date<=curMonthEnd);
  const returnedThisMonth=statsInjuries.filter(x=>x.retour&&x.retour>=curMonthStart&&x.retour<=curMonthEnd).length;
  const MONTHS_LABEL_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const monthLabel=`${MONTHS_LABEL_FR[selMonth.month]} ${selMonth.year}`;
  const seasonLabel=window._ctxSaison||CURRENT_SEASON;
  const now=new Date();
  const genDate=`${now.toLocaleDateString('fr-FR')} à ${now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;

  // Barres horizontales simples (top N)
  const bars=(rows,total,max=6)=>{
    const top=rows.slice(0,max);
    if(!top.length)return`<div class="empty">Pas de données.</div>`;
    const big=Math.max(...top.map(r=>r[1]));
    return top.map(([label,n])=>`<div class="bar"><span class="bl">${label}</span><span class="bt"><span style="width:${Math.round(n/big*100)}%"></span></span><span class="bv">${n}<em>${total?Math.round(n/total*100):0}%</em></span></div>`).join('');

  const rateBars=rows=>rows.length?rows.map(([label,pct,inj,tot])=>`<div class="bar"><span class="bl">${label}</span><span class="bt"><span style="width:${pct}%"></span></span><span class="bv">${pct}%<em>${inj}/${tot}</em></span></div>`).join(''):`<div class="empty">Pas de données.</div>`;

  const availSVG=()=>{
    if(!weeklyAvail.length)return'';
    const W=Math.max(520,weeklyAvail.length*62+60), step=(W-70)/Math.max(1,weeklyAvail.length-1||1);
    const X=i=>weeklyAvail.length===1?W/2:50+i*step, Y=v=>118-v*0.9;
    return`<svg viewBox="0 0 ${W} 150" style="width:100%;height:auto;">
      ${[0,50,100].map(v=>`<line x1="40" y1="${Y(v)}" x2="${W-10}" y2="${Y(v)}" stroke="#e6e7eb" stroke-width="1"/><text x="34" y="${Y(v)+3}" font-size="9" fill="#999" text-anchor="end">${v}%</text>`).join('')}
      <polyline points="${weeklyAvail.map((w,i)=>`${X(i)},${Y(w.pct)}`).join(' ')}" fill="none" stroke="#C8102E" stroke-width="2"/>
      ${weeklyAvail.map((w,i)=>{
        const c=w.pct>=80?'#22a559':w.pct>=60?'#e6791a':'#C8102E';
        return`<circle cx="${X(i)}" cy="${Y(w.pct)}" r="5" fill="${c}" stroke="#fff" stroke-width="1.5"/>
        <text x="${X(i)}" y="${Y(w.pct)-10}" font-size="10" font-weight="800" fill="#111" text-anchor="middle">${w.pctDisplay}%</text>
        <text x="${X(i)}" y="142" font-size="8.5" fill="#888" text-anchor="middle">${w.label}</text>`;
      }).join('')}

function bBlessuresCollectif(allInjuries,roster,catName,fullSeasonInjuries){
  const s=computeInjuryStats(allInjuries,roster);
  const vol=computeVolumeRates(allInjuries,catName||'Alamercery');
  const weeklyAvail=roster?computeWeeklyAvailability(roster,fullSeasonInjuries||allInjuries,SEASON_START_DATE,catName):[];
  const sectionTitle=(icon,label)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div style="width:32px;height:32px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${icon}</div>
      <div style="font-size:13px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:0.6px;">${label}</div>
    </div>`;

  // Joueurs actuellement blessés ou en réhabilitation — section actionnable en priorité
  const activePlayers=allInjuries.filter(isInjuryOngoing)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  // Graphique de taux (label, %, injured, total) — barre + fraction affichée
  function svgRateChart(data){
    if(!data.length)return`<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:16px;">Données insuffisantes.</div>`;
    return`<div>
      ${data.map(([label,pct,injured,tot])=>`<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:3px;">
          <span>${label}</span>
          <span style="font-weight:700;color:var(--text);">${injured}/${tot} joueurs · ${pct}%</span>
        </div>
        <div style="background:var(--surface2);border-radius:5px;height:10px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${pct>=50?'#c8102e':pct>=25?'#e6791a':'#22a559'};border-radius:5px;"></div>
        </div>
      </div>`).join('')}
    </div>`;
  }

  return`
    <!-- Bandeau KPI -->
    <div style="background:linear-gradient(135deg,var(--ink) 0%,#2a0a0a 100%);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
        <div style="font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;">🩹 Bilan blessures — saison en cours</div>
        <div style="display:flex;gap:6px;">
          <button onclick="view='wellnessinjury';wellnessData=null;render()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;">📊 Wellness ↔ Blessures</button>
          <button onclick="generateInjuryReport()" style="background:#fff;color:var(--ink);border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">📄 Rapport PDF</button>
        </div>
      </div>
      <div style="font-size:26px;font-weight:800;color:#fff;margin-bottom:20px;">${s.total} blessure${s.total>1?'s':''} enregistrée${s.total>1?'s':''}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        ${[
          [s.total,'Total','#fff','📋'],
          [s.ongoing,'En cours','#ff6b6b','🔴'],
          [s.avgDuration!==null?s.avgDuration.toFixed(0):'—','Jours absence (moy.)','#ffb347','⏱️'],
          [s.grave,'Graves','#ff6b6b','⚠️']
        ].map(([v,l,c,icon])=>`<div style="background:rgba(255,255,255,.06);border-radius:12px;padding:14px 8px;text-align:center;">
          <div style="font-size:16px;margin-bottom:4px;">${icon}</div>
          <div style="font-size:26px;font-weight:800;color:${c};line-height:1;">${v}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:0.3px;margin-top:6px;font-weight:600;">${l}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- Disponibilité hebdomadaire depuis la reprise — nuage de points -->
    ${weeklyAvail.length?`<div class="card" style="padding:18px;margin-bottom:16px;position:relative;">
      ${sectionTitle('📉',`Disponibilité de l'effectif — semaine par semaine depuis le ${fD(SEASON_START_DATE)}`)}
      <div style="overflow-x:auto;position:relative;">
        <svg viewBox="0 0 ${Math.max(380,weeklyAvail.length*80+50)} 150" style="width:100%;min-width:${weeklyAvail.length*80+50}px;">
          <!-- Grille horizontale (0/50/100%) -->
          ${[0,50,100].map(v=>{
            const y=108-v*0.68;
            return`<line x1="38" y1="${y}" x2="${38+weeklyAvail.length*80}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>
            <text x="32" y="${y+3}" font-size="9" fill="var(--text-muted)" text-anchor="end">${v}%</text>`;
          }).join('')}
          <!-- Ligne reliant les points (tendance) -->
          <polyline points="${weeklyAvail.map((w,i)=>`${58+i*80},${108-w.pct*0.68}`).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-opacity="0.45"/>
          <!-- Points du nuage -->
          ${weeklyAvail.map((w,i)=>{
            const px=58+i*80,py=108-w.pct*0.68;
            const dotColor=w.pct>=80?'#22a559':w.pct>=60?'#e6791a':'#c8102e';
            return`<g>
              ${w.opponent?`<text x="${px}" y="${py-22}" font-size="8" font-weight="700" fill="var(--primary)" text-anchor="middle">⚔️ ${w.opponent.length>10?w.opponent.slice(0,9)+'…':w.opponent}</text>`:''}
              <text x="${px}" y="${py-11}" font-size="12" font-weight="800" fill="var(--text)" text-anchor="middle">${w.pctDisplay}%</text>
              <circle cx="${px}" cy="${py}" r="7" fill="${dotColor}" stroke="#fff" stroke-width="1.5" style="cursor:pointer;"
                onmouseenter="showWeekTooltip(event,${i})" onmouseleave="hideWeekTooltip()"
                onclick="showWeekTooltip(event,${i})"></circle>
              ${w.isCurrent?`<circle cx="${px+10}" cy="${py-6}" r="3" fill="var(--alert-watch)"><title>Semaine en cours</title></circle>`:''}
              <text x="${px}" y="130" font-size="9" fill="var(--text-muted)" text-anchor="middle">${w.label}</text>
            </g>`;
          }).join('')}
        </svg>
        <div id="weekAvailTooltip" data-weekly='${JSON.stringify(weeklyAvail).replace(/'/g,"&#39;")}' onclick="hideWeekTooltip()" style="display:none;position:absolute;z-index:50;background:var(--ink);border:1.5px solid var(--primary);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:200px;max-width:260px;cursor:pointer;"></div>
      </div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:6px;">% = (effectif total − blessés − en réhabilitation) / effectif total. Touche/clique un point pour le détail des joueurs. ⚔️ = match cette semaine (nom de l'adversaire). 🟡 = semaine en cours.</div>
    </div>`:''}

    ${!allInjuries.length?`<div class="card" style="padding:20px;margin-bottom:16px;text-align:center;">
      <span style="color:var(--text-muted);font-size:13px;">Aucune blessure enregistrée pour cette période.</span>
    </div>`:''}

    <!-- État actuel de l'effectif : indisponibles puis joueurs en réathlétisation -->
    ${(()=>{
      const groups=groupOngoingByPlayer(fullSeasonInjuries||allInjuries,roster,injuriesDB);
      const ind=groups.filter(g=>g.status==='blesse'), reh=groups.filter(g=>g.status!=='blesse');
      if(!groups.length)return`<div class="card" style="padding:20px;margin-bottom:16px;text-align:center;border-left:4px solid var(--alert-ok);">
        <span style="color:var(--alert-ok);font-size:14px;font-weight:700;">Aucun joueur indisponible actuellement</span></div>`;
      const block=(title,color,list,empty)=>`<div class="card" style="padding:18px;margin-bottom:16px;border-left:4px solid ${color};">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <div style="font-size:13px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.6px;">${title} <span style="color:${color};">(${list.length})</span></div>
          ${bodyLegendHTML('dark')}
        </div>
        ${list.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;">${list.map(g=>injuryPlayerCardHTML(g,{theme:'dark',figWidth:44})).join('')}</div>`
          :`<div style="font-size:12px;color:var(--text-muted);">${empty}</div>`}
      </div>`;
      return block('Indisponibles','#C8102E',ind,'Aucun joueur indisponible.')+block('En réathlétisation','#e6791a',reh,'Aucun joueur en réathlétisation.');
    })()}

    <!-- Taux par génération et par groupe de postes -->
    ${roster&&roster.length?`<div class="card" style="padding:20px;margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>${sectionTitle('🎂','Taux de blessure par génération')}${svgRateChart(s.byGenRate)}</div>
        <div>${sectionTitle('⚔️','Avants vs 3/4')}${svgRateChart(s.byPosGroupRate)}</div>
      </div>
    </div>` : ''}

    <!-- Disponibilité effectif + Impact collectif -->
    <div class="card" style="padding:20px;margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        ${s.dispoRate!==null?`<div style="text-align:center;background:var(--surface2);border-radius:10px;padding:14px;border-top:3px solid ${s.dispoRate>=80?'var(--alert-ok)':s.dispoRate>=60?'var(--alert-watch)':'var(--primary)'};">
          <div style="font-size:24px;font-weight:800;color:${s.dispoRate>=80?'var(--alert-ok)':s.dispoRate>=60?'var(--alert-watch)':'var(--primary)'};">${s.dispoRate}%</div>
          <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;margin-top:4px;">Effectif disponible (${s.dispoCount}/${s.dispoTotal})</div>
        </div>`:''}
        <div style="text-align:center;background:var(--surface2);border-radius:10px;padding:14px;">
          <div style="font-size:24px;font-weight:800;color:var(--text);">${s.totalAbsenceDays}</div>
          <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;margin-top:4px;">Jours d'absence cumulés</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:10px;padding:14px;">
          <div style="font-size:24px;font-weight:800;color:var(--text);">${s.nbJoueursTouches}</div>
          <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;margin-top:4px;">Joueurs touchés</div>
        </div>
        <div style="text-align:center;background:var(--surface2);border-radius:10px;padding:14px;">
          <div style="font-size:24px;font-weight:800;color:${s.nbRecidivistes>0?'var(--primary)':'var(--text)'};">${s.nbRecidivistes}</div>
          <div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;margin-top:4px;">Récidivistes (2+ blessures)</div>
        </div>
      </div>

function bBlessuresIndividuel(players,allInjuries){
  // Regroupe chaque blessure vers le VRAI joueur du roster (nom + génération compatible),
  // pour que la liste déroulante affiche des noms de joueurs propres et que l'historique
  // soit toujours relié à la bonne fiche (même si le fichier de blessures n'a que le nom de famille).
  const byPlayer={};
  allInjuries.forEach(x=>{
    const xGen=parseInt(x.gen)||null;
    const match=players.find(p=>{
      const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
      if(!nameMatches)return false;
      if(xGen&&p.gen&&xGen!==p.gen)return false;
      return true;
    });
    const key=match?match.name.toUpperCase():x.nom.toUpperCase()+' (hors roster)';
    if(!byPlayer[key])byPlayer[key]=[];
    byPlayer[key].push(x);
  });

  const rosterNames=players.map(p=>p.name.toUpperCase());
  const allNames=[...new Set([...rosterNames,...Object.keys(byPlayer)])].sort();

  const selInjuries=blessurePlayer?(byPlayer[blessurePlayer]||[]):[];
  const sortedSel=[...selInjuries].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return`
    <div style="margin-bottom:14px;">
      <select onchange="blessurePlayer=this.value;render()" style="font-size:14px;">
        <option value="">— Choisir un joueur —</option>
        ${allNames.map(n=>`<option value="${n}" ${n===blessurePlayer?'selected':''}>${n}${byPlayer[n]?` (${byPlayer[n].length})`:''}</option>`).join('')}
      </select>
    </div>
    ${!blessurePlayer?`<div class="card" style="padding:30px;text-align:center;color:var(--text-muted);">Sélectionne un joueur pour voir son historique de blessures.</div>`:`
    <div style="display:grid;grid-template-columns:minmax(200px,240px) 1fr;gap:16px;align-items:start;">
      <div class="card" style="padding:16px;">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;text-align:center;">${blessurePlayer}</div>
        ${bodyFiguresHTML(selInjuries,{theme:'dark',width:96,gap:10,labelSize:9})}
        <div style="margin-top:12px;">${bodyLegendHTML('dark')}</div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;margin-top:8px;">Survole un point pour le détail. Sans côté renseigné, la blessure est marquée des deux côtés.</div>
      </div>
      <div class="card" style="padding:16px;">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;">📋 Historique (${sortedSel.length})</div>
        ${!sortedSel.length?`<div style="text-align:center;color:var(--text-muted);padding:16px;font-size:13px;">Aucune blessure enregistrée.</div>`:''}
        ${sortedSel.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:13px;font-weight:700;color:var(--text);">${x.type||'—'} · ${x.loc||'—'}</span>
            <span class="badge ${sevClass(x.gravite)}">${x.gravite||'—'}</span>
          </div>
          <div style="font-size:12px;color:var(--text-muted);">📅 ${x.date?fD(x.date):'Arrivé blessé'} · ${x.lieu||'—'} · ${x.typo||'—'}${computeInjuryDuration(x)!==null?` · ${computeInjuryDuration(x)}j d'absence`:''}</div>
          ${x.etape?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Étape : ${x.etape}</div>`:''}
          ${(()=>{const st=injuryStepStatus(x);const meta=PLAYER_STATUS_META[st];return st!=='disponible'?`<span style="display:inline-block;margin-top:4px;background:${meta.color}22;color:${meta.color};font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;">${meta.icon} ${meta.label}</span>`:'';})()}
          ${x.commentaire?`<button onclick="const el=document.getElementById('cmt_${x.id}');el.style.display=el.style.display==='none'?'block':'none';" style="display:block;background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:11px;cursor:pointer;margin-top:6px;padding:3px 9px;border-radius:6px;">💬 Voir le commentaire</button>
          <div id="cmt_${x.id}" style="display:none;background:var(--surface2);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;color:var(--text);font-style:italic;">"${x.commentaire}"</div>`:''}
          ${isAdmin()?`<button onclick="deleteInjury('${x.id}')" style="display:block;background:transparent;border:none;color:var(--primary-dark);font-size:11px;cursor:pointer;margin-top:4px;">🗑 Supprimer</button>`:''}
        </div>`).join('')}
      </div>
    </div>`}
  `;
}

function addManualInjury(form){
  const fd=new FormData(form);
  const entry={id:'inj'+Date.now(),source:'manual'};
  fd.forEach((v,k)=>entry[k]=v);
  injuriesDB.push(entry);
  saveInjuries();
  blessureAdding=false;
  render();
}

function deleteInjury(id){
  injuriesDB=injuriesDB.filter(x=>x.id!==id);
  saveInjuries();
  render();
}

function sevClass(g){
  if(!g)return'sev-default';
  const gl=g.toLowerCase();
  if(gl.includes('léger')||gl.includes('leger'))return'sev-leger';
  if(gl.includes('modéré')||gl.includes('modere'))return'sev-modere';
  if(gl.includes('grave'))return'sev-grave';
  return'sev-default';
}

//  RAPPORT D'ÉQUIPE RPE — génération imprimable
// ═══════════════════════════════════════════════════════
// Version imprimable (couleurs fixes, pas de variables CSS) du graphique de tendance hebdomadaire en points
// Version imprimable du graphique "Charge par joueur — sem. précédente vs en cours",
// scindée en Aptes / Blessés comme dans l'application.
function printSvgPlayersComparison(names,curLoad,prevLoad,nRows){
  if(!names.length)return'';
  const fmt=v=>Math.round(v); // chiffre exact, jamais d'abréviation type "2.1k"

  // Nombre de lignes fourni par l'appelant (1 = tout le monde sur une seule ligne, adapté aux
  // petits groupes comme les blessés ; 3 = réparti pour rester lisible avec un grand effectif).
  nRows=Math.max(1,Math.min(nRows||1,names.length));
  const base=Math.floor(names.length/nRows);
  const remainder=names.length%nRows;
  const rows=[];
  let idx=0;
  for(let i=0;i<nRows;i++){
    const size=base+(i<remainder?1:0);
    if(size>0)rows.push(names.slice(idx,idx+size));
    idx+=size;
  }

  return rows.map(rowNames=>{
    // Échelle propre à CHAQUE ligne : un joueur avec une valeur exceptionnellement élevée
    // (ex: forte charge la semaine précédant une blessure) ne doit pas écraser visuellement
    // les autres lignes qui n'ont rien à voir avec lui.
    const maxV=Math.max(...rowNames.map(n=>Math.max(curLoad[n]||0,prevLoad[n]||0)),1);
    const BW=20,GAP=4,GW=BW*2+GAP+18;
    const PL=48,PR=10,PT=22,PB=54;
    const W=PL+rowNames.length*GW+PR;
    const H=210;
    const yS=(H-PT-PB)/maxV;
    const bH=v=>Math.max(2,Math.round(v*yS));
    const xG=i=>PL+i*GW;
    const bars=rowNames.map((n,i)=>{
      const cur=curLoad[n]||0, prev=prevLoad[n]||0;
      const gx=xG(i);
      const sn=n.length>10?n.slice(0,9)+'…':n;
      return`${cur>0?`<rect x="${gx}" y="${H-PB-bH(cur)}" width="${BW}" height="${bH(cur)}" rx="3" fill="#C8102E"/>
      <text x="${gx+BW/2}" y="${H-PB-bH(cur)-5}" text-anchor="middle" font-size="8.5" fill="#111" font-weight="bold">${fmt(cur)}</text>`:''}
      ${prev>0?`<rect x="${gx+BW+GAP}" y="${H-PB-bH(prev)}" width="${BW}" height="${bH(prev)}" rx="3" fill="#999"/>
      <text x="${gx+BW+GAP+BW/2}" y="${H-PB-bH(prev)-5}" text-anchor="middle" font-size="8.5" fill="#666">${fmt(prev)}</text>`:''}
      <text x="${gx+BW+GAP/2}" y="${H-PB+16}" text-anchor="middle" font-size="9" fill="#666" transform="rotate(-40,${gx+BW+GAP/2},${H-PB+16})">${sn}</text>`;
    }).join('');
    const yLines=[0.25,0.5,0.75,1.0].map(f=>{const v=Math.round(maxV*f);const y=H-PB-Math.round(v*yS);return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-5}" y="${y+3}" text-anchor="end" font-size="8" fill="#999">${fmt(v)}</text>`;}).join('');
    return`<div style="page-break-inside:avoid;margin-bottom:10px;">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
        ${yLines}
        <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#ccc"/>
        ${bars}
      </svg>
    </div>`;
  }).join('');
}

// Version imprimable du graphique "RPE par séance — semaine sélectionnée"
function printSvgWeekRPE(sessions){
  const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const sorted=Object.values(sessions).sort((a,b)=>a.date.localeCompare(b.date)||a.type.localeCompare(b.type));
  if(!sorted.length)return'<div style="color:#999;text-align:center;padding:16px;font-size:12px;">Aucune séance cette semaine.</div>';
  const W=560,H=150,PL=30,PR=10,PT=20,PB=48;
  const n=sorted.length;
  const cW=(W-PL-PR)/n;
  const bW=Math.max(14,Math.min(34,cW-6));
  const maxV=10;
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+(cW-bW)/2;
  const bH=(v)=>Math.max(2,Math.round(v*yS));
  const typeColors={'Musculation':'#4a90d9','Terrain':'#22a559','Match':'#C8102E','Autre':'#999'};
  const bars=sorted.map((s,i)=>{
    const avg=s.rpeSum/s.count;
    const d=keyToDate(s.date);
    const jour=JOURS[d.getDay()];
    const col=typeColors[s.type]||'#999';
    const bx=x(i),by=H-PB-bH(avg);
    return`<rect x="${bx}" y="${by}" width="${bW}" height="${bH(avg)}" rx="3" fill="${col}"/>
    <text x="${bx+bW/2}" y="${by-4}" text-anchor="middle" font-size="10" font-weight="700" fill="#111">${avg.toFixed(1)}</text>
    <text x="${bx+bW/2}" y="${H-PB+13}" text-anchor="middle" font-size="9" font-weight="700" fill="#444">${jour}</text>
    <text x="${bx+bW/2}" y="${H-PB+24}" text-anchor="middle" font-size="8" fill="${col}">${s.type}</text>`;
  }).join('');
  const yLines=[0,2,4,6,8,10].map(v=>`
    <line x1="${PL}" y1="${H-PB-bH(v)}" x2="${W-PR}" y2="${H-PB-bH(v)}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-4}" y="${H-PB-bH(v)+3}" text-anchor="end" font-size="8" fill="#999">${v}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    ${yLines}
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#ccc"/>
    ${bars}
  </svg>`;
}

function printSvgWeeklyPoints(weeklyLoads,wStart,catName){
  // Fenêtre fixe : commence à la semaine calendaire S36, s'arrête à la semaine sélectionnée
  // (n'affiche jamais de semaines postérieures à celle du rapport, même si l'app a des données plus récentes).
  let recent=weeklyLoads.filter(w=>w.hasDur&&w.week>=36&&w.wk<=wStart);
  if(!recent.length)return'<div style="color:#999;text-align:center;padding:16px;font-size:12px;">Aucune donnée disponible.</div>';
  // Matchs de chaque semaine affichée (calendrier) : leur logo est posé au-dessus de la charge,
  // ce qui donne sur la saison une vue d'ensemble des clubs affrontés.
  const matchesByWeek={};
  recent.forEach(w=>{const ms=getMatchesForWeek(w.wk,catName);if(ms.length)matchesByWeek[w.wk]=ms;});
  const hasMatch=Object.keys(matchesByWeek).length>0;
  const LOGO=30,EXTRA=hasMatch?LOGO+12:0; // place réservée en haut du graphique pour les logos
  const W=Math.max(380,recent.length*70+60),H=190+EXTRA,PL=42,PR=14,PT=26+EXTRA,PB=36;
  const cW=(W-PL-PR)/recent.length;
  const maxV=Math.max(...recent.map(w=>w.avg),1);
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+cW/2;
  const y=(v)=>H-PB-Math.round(v*yS);
  const col=(v)=>v>=600?'#C8102E':v>=400?'#e6791a':v>=200?'#e6b800':'#22a559';
  const svgOpp=(name,cx,top,size)=>{
    const logo=opponentLogos[oppKey(name)];
    if(logo)return`<image href="${logo}" x="${cx-size/2}" y="${top}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet"/>`;
    return`<circle cx="${cx}" cy="${top+size/2}" r="${size/2-1}" fill="#ececec" stroke="#c8c8c8" stroke-width="1.5"/><text x="${cx}" y="${top+size/2+3.5}" text-anchor="middle" font-size="${Math.round(size*0.3)}" font-weight="800" fill="#666">${oppInitials(name)}</text>`;
  };
  const points=recent.map((w,i)=>{
    const isCur=w.wk===wStart;
    const px=x(i),py=y(w.avg);
    const ms=matchesByWeek[w.wk]||[];
    const logoTop=py-26-LOGO; // juste au-dessus du chiffre de charge
    const logos=ms.slice(0,2).map((m,j,arr)=>svgOpp(m.opponent,px+(j-(arr.length-1)/2)*(LOGO+4),logoTop,LOGO)).join('');
    return`<g>
      ${logos}
      ${w.avg>0?`<text x="${px}" y="${py-13}" text-anchor="middle" font-size="11" font-weight="800" fill="#111">${Math.round(w.avg)}</text>`:''}
      <circle cx="${px}" cy="${py}" r="${isCur?7:5}" fill="${col(w.avg)}" stroke="#fff" stroke-width="${isCur?2:1}"/>
      <text x="${px}" y="${H-PB+15}" text-anchor="middle" font-size="9" font-weight="${isCur?'700':'400'}" fill="${isCur?'#C8102E':'#777'}">${w.label}</text>
    </g>`;
  }).join('');
  const polyline=`<polyline points="${recent.map((w,i)=>`${x(i)},${y(w.avg)}`).join(' ')}" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-opacity="0.4"/>`;
  // Repères de l'axe vertical : pas adapté à l'ordre de grandeur des charges (et non plus figé à 600).
  const tickStep=[100,200,250,500,1000,2000].find(s=>maxV/s<=5)||2000;
  const ticks=[];for(let v=0;v<=maxV*1.05;v+=tickStep)ticks.push(v);
  const yLines=ticks.map(v=>`
    <line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-6}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#999">${v}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${yLines}${polyline}${points}</svg>`+
    (hasMatch?`<div style="font-size:9px;color:#999;margin-top:2px;">Le logo au-dessus d'un point = adversaire de la semaine de match.</div>`:'');
}

// Affiche une fenêtre de choix de semaine avant de générer le rapport PDF,
// pour ne jamais dépendre implicitement de la semaine actuellement affichée dans l'app.
// ═══════════════════════════════════════════════════════
//  MATCHS DE LA SEMAINE + LOGOS (rapport de charge)
// ═══════════════════════════════════════════════════════
// Les matchs du calendrier n'ont pas de champ "adversaire" : le nom et le lieu sont dans le titre,
// ex: "Lyon Ol U (ext) — J1" ou "CA Périgourdin (dom)".
function parseMatchEvent(e){
  const t=String(e.title||'').trim();
  const m=t.match(/^(.*?)\s*\((dom|ext)[^)]*\)/i);
  let opponent=(m?m[1]:t).replace(/\s*[—–-]\s*J\d+\s*$/i,'').trim();
  let home=null;
  if(m)home=m[2].toLowerCase()==='dom';
  else{
    const d=String(e.desc||'');
    if(/re[cç]oit|domicile/i.test(d))home=true;
    else if(/ext[ée]rieur/i.test(d))home=false;
  }
  return{opponent,home};
}
// Matchs de l'équipe dont la date tombe dans la semaine commençant à weekStartKey (lundi, AAAA-MM-JJ).
function getMatchesForWeek(weekStartKey,catName){
  const endD=keyToDate(weekStartKey);endD.setDate(endD.getDate()+6);
  const endKey=dateToKey(endD);
  const toKey=d=>{
    const s=String(d||'');
    let m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m)return`${m[3]}-${m[2]}-${m[1]}`;
    m=s.match(/^(\d{4}-\d{2}-\d{2})/);
    return m?m[1]:null;
  };
  return(adminEvents||[])
    .filter(e=>{
      if(e.type!=='match')return false;
      if(catName&&e.cat!==catName&&e.cat!=='Tous')return false;
      const k=toKey(e.date);
      return k&&k>=weekStartKey&&k<=endKey;
    })
    .map(e=>({date:toKey(e.date),...parseMatchEvent(e)}))
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function resizeImageToDataURL(file,maxPx,cb){
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/png'));
    };
    img.onerror=()=>alert('Image illisible.');
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

function oppInitials(name){
  const skip=/^(de|du|la|le|les|des|d|rc|fc|as|us|cs|ca|ol|u|club|rugby)$/i;
  const words=String(name||'').replace(/[^A-Za-zÀ-ÿ\s]/g,' ').split(/\s+/).filter(w=>w&&!skip.test(w));
  const base=words.length?words:String(name||'').split(/\s+/).filter(Boolean);
  // Un seul mot significatif (ex: "Lyon", "Grenoble") : 3 lettres, plus parlantes qu'une seule initiale.
  if(base.length===1)return base[0].slice(0,3).toUpperCase();
  const ini=base.slice(0,3).map(w=>w[0]).join('').toUpperCase();
  return ini||'?';
}

function checkPwd(){
  const input=document.getElementById('pwdInput').value;
  const stored=localStorage.getItem('nr-pwd');
  if(btoa(input)===stored){adminUnlocked=true;render();}
  else{document.getElementById('pwdErr').textContent='Mot de passe incorrect.';}
}
function setPwd(){
  const p1=document.getElementById('pwd1').value;
  const p2=document.getElementById('pwd2').value;
  if(!p1||p1.length<4){document.getElementById('pwdErr').textContent='Minimum 4 caractères.';return;}
  if(p1!==p2){document.getElementById('pwdErr').textContent='Les mots de passe ne correspondent pas.';return;}
  localStorage.setItem('nr-pwd',btoa(p1));
  adminUnlocked=true;render();
}

const TEST_MAP={'10m':'10m','20m':'20m','30m':'30m','50m':'50m','YOYO':'YOYO','Yoyo':'YOYO','BRONCO':'BRONCO','DC':'DC',' DC':'DC','SQUAT':'SQUAT',' SQUAT':'SQUAT','SDT':'SDT','1RM Epaulé':'1RM Epaulé','Epaulé':'1RM Epaulé','FRONT SQUAT':'Front Squat','Front Squat':'Front Squat','Tractions':'Tractions','Tirage planche':'Tirage planche','TIRAGE PLANCHE':'Tirage planche','TP':'Tirage planche','Pesé':'Pesé','Taille':'Taille','Dorsiflexion mobility D':'Dorsi D','Dorsiflexion mobility G':'Dorsi G','Dorsi D':'Dorsi D','Dorsi G':'Dorsi G'};

function normName(n){return String(n||'').trim().toUpperCase().replace('LELIEVRE','LELIÈVRE').replace('HEROULT','HÉROULT').replace('HUBERT ','HUBER ');}

function xlsxDate(v){
  if(!v)return'';
  if(typeof v==='number'){const d=new Date((v-25569)*86400*1000);return d.toISOString().slice(0,10);}
  if(v instanceof Date)return v.toISOString().slice(0,10);
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10); // déjà ISO
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); // DD/MM/YYYY, DD-MM-YYYY, DD.MM.YYYY
  if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s.slice(0,10);
}

// Trouve le bon nom de test (insensible à la casse) dans TEST_MAP
function normalizeTestName(test){
  const t=String(test||'').trim();
  if(TEST_MAP[t])return TEST_MAP[t];
  const tu=t.toUpperCase();
  for(const[k,v] of Object.entries(TEST_MAP)){
    if(k.toUpperCase()===tu)return v;
  }
  return t;
}

function importTests(e){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('importStatus');
  st.innerHTML='<span style="color:var(--text-muted);">⏳ Traitement en cours...</span>';
  if(!window.XLSX){st.innerHTML='<span style="color:#cc0000;">⚠️ Bibliothèque XLSX non chargée. Vérifiez votre connexion internet.</span>';return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd'});
      const headerRow=allRows[0]||[];
      const rows=allRows.slice(1);
      const cm=buildColMap(headerRow,TEST_HEADER_MAP);
      // Fallback sur positions historiques si en-têtes non détectés
      if(cm.date<0)cm.date=0;
      if(cm.name<0)cm.name=1;
      if(cm.test<0)cm.test=2;
      if(cm.score<0)cm.score=3;
      if(cm.gen<0)cm.gen=5;

      const playerTests={};const playerGen={};const playerDisplayName={};
      for(const row of rows){
        const date=row[cm.date],name=row[cm.name],test=row[cm.test],score=row[cm.score],gen=row[cm.gen];
        if(!name||!test||score===undefined||score===null||score==='')continue;
        const nm=canonicalNameKey(name); // insensible casse + ordre Nom/Prénom
        if(!nm)continue;
        if(!playerDisplayName[nm])playerDisplayName[nm]=normName(name);
        const nt=normalizeTestName(test);
        const ds=xlsxDate(date);if(!ds)continue;
        const sv=isNaN(parseFloat(String(score).replace(',','.')))?(String(score)):parseFloat(String(score).replace(',','.'));
        if(!playerTests[nm])playerTests[nm]={};
        if(!playerTests[nm][nt])playerTests[nm][nt]=[];
        // Avoid duplicates
        if(!playerTests[nm][nt].some(e=>e[0]===ds&&e[1]==sv))
          playerTests[nm][nt].push([ds,sv]);
        if(gen)playerGen[nm]=parseInt(gen);
      }
      // Sort
      for(const nm of Object.keys(playerTests))
        for(const t of Object.keys(playerTests[nm]))
          playerTests[nm][t].sort((a,b)=>a[0].localeCompare(b[0]));
      // Merge into ACTIVE_DB — uniquement les joueurs déjà existants (roster = source de vérité)
      let updated=0,skipped=0;const skippedNames=[];
      const newDB=[...ACTIVE_DB];
      for(const [nm,tests] of Object.entries(playerTests)){
        const idx=findPlayerIndexByName(newDB,playerDisplayName[nm]);
        if(idx>=0){
          newDB[idx]={...newDB[idx],t:{...newDB[idx].t,...tests}};
          updated++;
        } else {
          skipped++;
          skippedNames.push(playerDisplayName[nm]);
        }
      }
      ACTIVE_DB=newDB;
      saveDB();
      const now=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      lastImportDate=now;localStorage.setItem('nr-import-date',now);
      const detected=Object.entries(cm).map(([f,i])=>`${f}${i>=0?'✓':'✗'}`).join(' ');
      st.innerHTML=`<span style="color:var(--alert-ok);">✅ ${updated} joueur${updated>1?'s':''} mis à jour.</span>${skipped?`<br><span style="color:var(--primary-dark);">⏭️ ${skipped} ignoré${skipped>1?'s':''} (pas dans le roster actuel — normal si non repris ou test d'un joueur externe)</span>`:''}<br><span style="font-size:9px;color:var(--text-muted);">Colonnes détectées : ${detected}</span>${skipped?`<br><span style="font-size:9px;color:var(--text-muted);">Ignorés : ${skippedNames.join(', ')}</span>`:''}`;
      setTimeout(render,1200);
    }catch(err){
      console.error(err);
      st.innerHTML=`<span style="color:#cc0000;">❌ Erreur : ${err.message}</span>`;
    }
  };
  reader.readAsBinaryString(f);
}

function normHeader(h){
  return String(h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
const INFOS_HEADER_MAP={
  name:['nom','noms','name','joueur'],
  prenom:['prenom','prenoms','firstname'],
  dob:['datedenaissance','datenaissance','naissance','dob'],
  gen:['generation','annee','anneedenaissance','anneenaissance'],
  age:['age'],
  photo:['photo'],
  cat:['categorie','cat'],
  p1:['poste1','poste','posteprincipal','poste1eme','position1'],
  p2:['poste2','postesecondaire','position2'],
  sc:['statutclub','statut','statutclub1','statutsportif'],
  sffr:['statutffr','statutfederal','sffr']
};
const TEST_HEADER_MAP={
  date:['date','jour'],
  name:['nom','noms','name','joueur'],
  test:['test','epreuve','exercice','type'],
  score:['score','valeur','resultat','note','performance'],
  gen:['generation','annee','anneedenaissance','anneenaissance']
};
function buildColMap(headerRow,headerMap){
  headerMap=headerMap||INFOS_HEADER_MAP;
  const norm=headerRow.map(h=>normHeader(h));
  const colMap={};
  for(const[field,variants]of Object.entries(headerMap)){
    let idx=-1;
    for(const v of variants){idx=norm.indexOf(v);if(idx>=0)break;}
    if(idx<0){for(let i=0;i<norm.length;i++){if(variants.some(v=>norm[i].includes(v)||v.includes(norm[i]))){idx=i;break;}}}
    colMap[field]=idx;
  }
  return colMap;
}

function importAcademie(e){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('infosStatus_Academie');
  st.innerHTML='<span style="color:var(--text-muted);">⏳ Traitement...</span>';
  if(!window.XLSX){st.innerHTML='<span style="color:#cc0000;">⚠️ XLSX non chargée.</span>';return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      const headerRow=allRows[0]||[];
      const rows=allRows.slice(1);
      const cm=buildColMap(headerRow,INFOS_HEADER_MAP);
      if(cm.name<0)cm.name=0;

      // Construit la liste des clés canoniques à mettre en Académie
      const academieKeys=new Set();
      const rowData=[];
      for(const row of rows){
        const get=f=>cm[f]>=0?String(row[cm[f]]||'').trim():undefined;
        const rawName=get('name'),rawPrenom=get('prenom');
        if(!rawName)continue;
        const name=rawPrenom?`${rawName} ${rawPrenom}`:rawName;
        const gen=parseInt(get('gen'))||null;
        const ck=canonicalNameKey(name);
        academieKeys.add(ck);
        rowData.push({name,gen,ck});
      }

      const newDB=[...ACTIVE_DB];

      // Reset : retire Académie de TOUS les joueurs (repart de zéro)
      newDB.forEach((p,i)=>{if(p.sc==='Académie')newDB[i]={...p,sc:''};});

      // Correspondance STRICTE uniquement (clé canonique exacte)
      let updated=0,added=0,skipped=0;
      for(const{name,gen,ck}of rowData){
        // Match strict : clé canonique identique
        const idx=newDB.findIndex(p=>canonicalNameKey(p.name)===ck);
        if(idx>=0){
          newDB[idx]={...newDB[idx],sc:'Académie',gen:gen||newDB[idx].gen};
          updated++;
        } else {
          // Dernier recours : même nom de famille ET même génération (évite faux positifs)
          const parts=nameWords(name).filter(w=>w.length>=3);
          const idx2=gen?newDB.findIndex(p=>{
            const pWords=nameWords(p.name).filter(w=>w.length>=3);
            return p.gen===gen&&parts.some(w=>pWords.includes(w));
          }):-1;
          if(idx2>=0){
            newDB[idx2]={...newDB[idx2],sc:'Académie'};
            updated++;
          } else {
            // Crée le joueur s'il n'existe vraiment pas
            const id='imp'+Date.now()+Math.random().toString(36).slice(2,6);
            const cat=gen?genToCat(gen):'Alamercery';
            newDB.push({id,name:normName(name),cat,gen,sc:'Académie',sffr:'',p1:'',p2:'',dob:null,age:null,t:{}});
            added++;
          }
        }
      }

      ACTIVE_DB=newDB;saveDB();
      st.innerHTML=`<span style="color:var(--alert-ok);">✅ ${updated} mis à jour${added?', '+added+' ajoutés':''}.</span>`;
      setTimeout(render,1200);
    }catch(err){st.innerHTML=`<span style="color:#cc0000;">❌ ${err.message}</span>`;}

function importInfos(e,targetCat){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('infosStatus_'+targetCat);
  st.innerHTML='<span style="color:var(--text-muted);">⏳ Traitement en cours...</span>';
  if(!window.XLSX){st.innerHTML='<span style="color:#cc0000;">⚠️ XLSX non chargée.</span>';return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      const headerRow=allRows[0]||[];
      const rows=allRows.slice(1);
      const cm=buildColMap(headerRow);
      if(cm.name<0) cm.name=0; // fallback : 1ère colonne = nom
      let updated=0,added=0,archived=0;
      const newDB=[...ACTIVE_DB];
      const seenNames=new Set();

      for(const row of rows){
        const get=f=>cm[f]>=0?row[cm[f]]:undefined;
        const rawName=get('name');
        const rawPrenom=get('prenom');
        if(!rawName)continue;
        const name=rawPrenom?`${rawName} ${rawPrenom}`:rawName; // combine si colonnes séparées Nom/Prénom
        const dob=get('dob'),gen=get('gen'),p1=get('p1'),p2=get('p2'),sc=get('sc'),sffr=get('sffr');
        const nk=canonicalNameKey(name); // insensible casse + ordre Nom/Prénom
        if(!nk)continue;
        seenNames.add(nk);
        const gn=parseInt(gen)||null;
        let dobStr='';
        if(dob){
          if(dob instanceof Date)dobStr=dob.toISOString().slice(0,10);
          else if(typeof dob==='string'&&dob.match(/\d{4}-\d{2}-\d{2}/))dobStr=dob.slice(0,10);
          else if(typeof dob==='number')dobStr=xlsxDate(dob);
        }
        const today=new Date();
        let age=null;
        if(dobStr){const d=new Date(dobStr);if(!isNaN(d)){age=today.getFullYear()-d.getFullYear()-((today.getMonth(),today.getDate())<(d.getMonth(),d.getDate())?1:0);}}
        const idx=findPlayerIndexByName(newDB,name);
        if(idx>=0){
          newDB[idx]={...newDB[idx],name:normName(name),cat:targetCat,gen:gn||newDB[idx].gen,dob:dobStr||newDB[idx].dob,age:age!==null?age:newDB[idx].age,
            p1:String(p1||'').trim().replace('/','')||newDB[idx].p1||'',
            p2:String(p2||'').trim().replace('/','')||newDB[idx].p2||'',
            sc:String(sc||'').trim().replace('/','')||newDB[idx].sc||'',
            sffr:String(sffr||'').trim().replace('/','')||newDB[idx].sffr||''};
          updated++;
        } else {
          const id='imp'+Date.now()+Math.random().toString(36).slice(2,6);
          newDB.push({id,name:normName(name),cat:targetCat,gen:gn,dob:dobStr||null,age,
            p1:String(p1||'').trim().replace('/',''),p2:String(p2||'').trim().replace('/',''),
            sc:String(sc||'').trim().replace('/',''),sffr:String(sffr||'').trim().replace('/',''),t:{}});
          added++;
        }
      }

      // Archiver les joueurs qui étaient dans cette catégorie mais absents du nouveau fichier
      for(let i=0;i<newDB.length;i++){
        const p=newDB[i];
        if(p.cat===targetCat&&!seenNames.has(canonicalNameKey(p.name))){
          newDB[i]={...p,cat:'Archivé'};
          archived++;
        }
      }

      ACTIVE_DB=newDB;saveDB();
      const detected=Object.entries(cm).map(([f,i])=>`${f}${i>=0?'✓':'✗'}`).join(' ');
      st.innerHTML=`<span style="color:var(--alert-ok);">✅ ${added} ajouté${added>1?'s':''}, ${updated} mis à jour${archived>0?`, ${archived} archivé${archived>1?'s':''}`:''}.</span><br><span style="font-size:9px;color:var(--text-muted);">Colonnes détectées : ${detected}</span>`;
      setTimeout(render,1200);
    }catch(err){
      st.innerHTML=`<span style="color:#cc0000;">❌ Erreur : ${err.message}</span>`;
    }
  };
  reader.readAsBinaryString(f);
}

// ═══════════════════════════════════════════════════════
//  CORRESPONDANCE DE NOMS — insensible à la casse, accents, et à l'ordre Nom/Prénom
// ═══════════════════════════════════════════════════════
function nameWords(name){
  return String(name||'')
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z\s-]/g,' ')
    .split(/[\s-]+/)
    .filter(w=>w.length>=2);
}
// Clé canonique : mots triés alphabétiquement, donc "Paul Acker", "ACKER Paul", "acker paul" → même clé
function canonicalNameKey(name){
  return nameWords(name).sort().join(' ');
}
// Extrait une éventuelle initiale isolée (ex: "Boyer C." -> "C") pour distinguer des homonymes
// dont seul le nom de famille est commun (ex: Boyer Clément vs Boyer Timothé).
function extractInitial(name){
  const m=String(name||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/\b([A-Z])\.?\s*$/);
  return m?m[1]:null;
}
// Correspondance nom-réponse -> joueur du roster, robuste aux homonymes de famille (plusieurs
// joueurs partageant le même nom de famille, ex: Boyer C. / Boyer T.) : un match sur le seul nom
// de famille n'est accepté que s'il est SANS AMBIGUÏTÉ dans le roster, ou si l'initiale du prénom
// (ex: "C." dans "Boyer C.") correspond bien à ce joueur précis et à aucun autre du roster.
function respondedNameMatchesPlayer(respondedName,player,rosterPlayers){
  const rn=canonicalNameKey(respondedName),pn=canonicalNameKey(player.name);
  if(rn===pn)return true;
  const rWords=nameWords(respondedName),pWords=nameWords(player.name);
  const overlap=rWords.filter(w=>pWords.includes(w));
  if(!overlap.length)return false;
  const others=(rosterPlayers||[]).filter(pl=>pl.id!==player.id);
  const ambiguous=others.some(pl=>{
    const plWords=nameWords(pl.name);
    return overlap.some(w=>plWords.includes(w));
  });
  if(!ambiguous)return true; // mot(s) commun(s) suffisant(s) et sans ambiguïté dans le roster
  // Ambigu (nom de famille partagé) : n'accepte que si une initiale précise distingue ce joueur
  const initial=extractInitial(respondedName);
  if(!initial)return false;
  const firstNamePart=pWords.find(w=>!overlap.includes(w)); // approx. prénom du joueur
  if(!firstNamePart||firstNamePart[0]!==initial)return false;
  // Vérifie qu'aucun AUTRE joueur ambigu ne partage aussi cette même initiale
  const stillAmbiguous=others.some(pl=>{
    const plWords=nameWords(pl.name);
    if(!overlap.some(w=>plWords.includes(w)))return false;
    const plFirst=plWords.find(w=>!overlap.includes(w));
    return plFirst&&plFirst[0]===initial;
  });
  return !stillAmbiguous;
}
// Cherche l'index d'un joueur dans une liste, peu importe la casse ou l'ordre des mots du nom.
// Essaie d'abord une correspondance exacte (mots identiques), puis un repli sur le nom de famille seul.
function findPlayerIndexByName(list,searchName){
  const target=canonicalNameKey(searchName);
  if(!target)return-1;
  let idx=list.findIndex(p=>canonicalNameKey(p.name)===target);
  if(idx>=0)return idx;
  // Repli : au moins un mot significatif (≥3 lettres) en commun
  const searchWords=nameWords(searchName).filter(w=>w.length>=3);
  if(!searchWords.length)return-1;
  idx=list.findIndex(p=>{
    const pWords=nameWords(p.name).filter(w=>w.length>=3);
    return searchWords.some(w=>pWords.includes(w));
  });
  return idx;
}

// ═══════════════════════════════════════════════════════
//  AFFICHAGE / TRI PAR NOM DE FAMILLE
// ═══════════════════════════════════════════════════════
// Nom affiché dans les listes/cartes/tableaux : nom de famille uniquement.
function pListName(p){
  return(p.surname||p.name||'').toUpperCase();
}
// Comme pListName, mais ajoute l'initiale du prénom si un AUTRE joueur de la même liste partage
// le même nom de famille (ex: "BOYER C." plutôt qu'un "BOYER" ambigu entre deux joueurs).
function pListNameDisambig(p,allPlayers){
  const surname=pListName(p);
  const homonyms=(allPlayers||[]).filter(pl=>pListName(pl)===surname);
  if(homonyms.length<=1)return surname;
  let first=p.firstname;
  if(!first){
    const parts=(p.name||'').trim().split(/\s+/);
    first=parts.length>1?parts.slice(1).join(' '):'';
  }
  return first?`${surname} ${first[0].toUpperCase()}.`:surname;
}
// Nom complet affiché sur la fiche joueur : nom de famille + prénom.
function pFullDisplayName(p){
  const sur=(p.surname||p.name||'').toUpperCase();
  const first=p.firstname||'';
  return first?`${sur} ${first}`:sur;
}
// Comparateur de tri alphabétique par nom de famille (avec repli sur prénom si même nom de famille).
function bySurname(a,b){
  const sa=(a.surname||a.name||'').toUpperCase();
  const sb=(b.surname||b.name||'').toUpperCase();
  if(sa!==sb)return sa.localeCompare(sb);
  return(a.firstname||'').localeCompare(b.firstname||'');
}

function normalizeName(n){
  return String(n||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,'').trim();
}

function findPlayerByName(searchName){
  const sn=normalizeName(searchName);
  // Try exact match first
  let p=ACTIVE_DB.find(pl=>normalizeName(pl.name)===sn);
  if(p) return p;
  // Try last name match
  const parts=sn.split(' ');
  for(const part of parts){
    if(part.length<3) continue;
    p=ACTIVE_DB.find(pl=>normalizeName(pl.name).includes(part));
    if(p) return p;
  }
  return null;
}

//  AUTO-FETCH HISTORIQUE MATCHS DÉTAILLÉ (style TurnOver)
// ═══════════════════════════════════════════════════════
function mergeAutoMatchEntries(existingLog, newAutoEntries){
  const manual=(existingLog||[]).filter(e=>e.source!=='auto');
  // Une feuille de match saisie dans la page Statistiques fait foi : la synchro IA ne la double pas.
  const sheetDates=new Set(manual.filter(e=>e.source==='feuille').map(e=>e.date));
  newAutoEntries=(newAutoEntries||[]).filter(e=>!sheetDates.has(e.date));
  const oldAuto=(existingLog||[]).filter(e=>e.source==='auto'&&!sheetDates.has(e.date));
  const key=e=>(e.date||'')+'|'+(e.adversaire||'').toLowerCase().trim();
  const map=new Map();
  oldAuto.forEach(e=>map.set(key(e),e));
  newAutoEntries.forEach(e=>map.set(key(e),e));
  return[...manual,...map.values()];
}

        date:m.date||'', comp:m.comp||'', adversaire:m.adversaire||'',
        score:m.score||'', result:m.resultat||m.result||'V',
        min:parseInt(j.min)||0, tit:!!(j.titulaire!==undefined?j.titulaire:j.tit),
        essais:parseInt(j.essais)||0, transfo:parseInt(j.transfo)||0, pen:parseInt(j.pen)||0,
        cj:parseInt(j.cj)||0, cr:parseInt(j.cr)||0, source:'auto'
      };
      if(!perPlayerNew[p.id]) perPlayerNew[p.id]=[];
      perPlayerNew[p.id].push(entry);
    }
  }

  let updated=0;
  for(const[id,entries]of Object.entries(perPlayerNew)){
    const existing=(OV[id]&&OV[id].matchLog)?OV[id].matchLog:[];
    const merged=mergeAutoMatchEntries(existing,entries);
    OV[id]={...OV[id]||{},matchLog:merged};
    updated++;
  }
  saveOV();
  return{updated,matchsFound:allMatches.length};
}

async function syncMatchLogPublic(catTarget){
  const btn=document.getElementById('syncMatchLogBtn');
  const st=document.getElementById('syncMatchLogStatus');
  if(btn) btn.disabled=true, btn.textContent='⏳ Recherche en cours...';
  if(st) st.innerHTML='<span style="color:var(--ink-soft);">L\'IA parcourt les feuilles de match sur le site FFR...</span>';

  try{
    const result=await syncMatchLogDetailed(catTarget, (msg)=>{
      if(st) st.innerHTML=`<span style="color:var(--ink-soft);">⏳ ${msg}</span>`;
    });
    if(btn) btn.disabled=false, btn.textContent="🤖 Récupérer l'historique détaillé des matchs (minutes, essais...)";
    if(st) st.innerHTML=`<span style="color:var(--alert-ok);">✅ ${result.matchsFound} match${result.matchsFound>1?'s':''} analysé${result.matchsFound>1?'s':''} · ${result.updated} joueur${result.updated>1?'s':''} mis à jour !</span>`;
  }catch(e){
    if(btn) btn.disabled=false, btn.textContent="🤖 Récupérer l'historique détaillé des matchs (minutes, essais...)";
    if(st) st.innerHTML=`<span style="color:#cc0000;">❌ Erreur: ${e.message}<br>Réessaie dans quelques secondes.</span>`;
    console.error(e);
  }
}

  try{

  }catch(e){
    document.getElementById('exportStatus').innerHTML='<span style="color:#cc0000;">❌ Erreur : '+e.message+'</span>';
  }
}

function importData(e){
  const f=e.target.files[0];if(!f)return;
  const st=document.getElementById('exportStatus');
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const payload=JSON.parse(ev.target.result);
      if(payload.ov){
        OV=payload.ov;
        saveOVSafe(); // compression auto si nécessaire
      }
      if(payload.db){
        ACTIVE_DB=payload.db;
        localStorage.setItem('nr-db',JSON.stringify(ACTIVE_DB));
      }
      if(payload.events&&Array.isArray(payload.events)){
        adminEvents=payload.events;
        saveEvents();
      }
      if(payload.logo){
        customLogo=payload.logo;
        localStorage.setItem('nr-logo',customLogo);
      }
      const d=payload.date||'?';
      st.innerHTML=`<span style="color:var(--alert-ok);">✅ Données du ${d} importées !</span>`;
      setTimeout(render,1500);
    }catch(err){
      st.innerHTML='<span style="color:#cc0000;">❌ Fichier invalide : '+err.message+'</span>';
    }
  };
  reader.readAsText(f);
}

function resetDB(){
  if(!confirm('Réinitialiser la base de données aux données d\'origine ? Les photos seront conservées.'))return;
  ACTIVE_DB=[...BASE_DB];
  lastImportDate=null;
  localStorage.removeItem('nr-db');
  localStorage.removeItem('nr-import-date');
  render();
}
