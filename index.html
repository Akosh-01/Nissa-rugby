//  EXCLUSION MANUELLE DE LA MOYENNE RPE (en plus de l'exclusion automatique pour blessure)
//  Propre à CHAQUE SEMAINE : exclure un joueur une semaine ne doit pas changer les moyennes
//  des autres semaines déjà calculées.
// ═══════════════════════════════════════════════════════
let manuallyExcludedRPE=new Set(JSON.parse(localStorage.getItem('nr-rpe-excluded')||'[]'));
function rpeExclusionKey(name,weekStartKey){
  return normAccent(name)+'|'+weekStartKey;
}
function isManuallyExcludedRPE(name,weekStartKey){
  return manuallyExcludedRPE.has(rpeExclusionKey(name,weekStartKey));
}
function toggleRPEExclusion(name,weekStartKey){
  const key=rpeExclusionKey(name,weekStartKey);
  if(manuallyExcludedRPE.has(key))manuallyExcludedRPE.delete(key);
  else manuallyExcludedRPE.add(key);
  localStorage.setItem('nr-rpe-excluded',JSON.stringify([...manuallyExcludedRPE]));
  render();
}
// Version utilisée depuis la fenêtre de gestion : ne referme pas la fenêtre à chaque clic,
// pour pouvoir cocher/décocher plusieurs joueurs à la suite.
function toggleRPEExclusionInModal(name,weekStartKey){
  const key=rpeExclusionKey(name,weekStartKey);
  if(manuallyExcludedRPE.has(key))manuallyExcludedRPE.delete(key);
  else manuallyExcludedRPE.add(key);
  localStorage.setItem('nr-rpe-excluded',JSON.stringify([...manuallyExcludedRPE]));
  const list=document.getElementById('rpeExclusionList');
  if(list)list.innerHTML=rpeExclusionListHTML(weekStartKey);
  // Rafraîchit aussi le tableau de bord derrière la fenêtre, pour que la moyenne hebdomadaire
  // se mette à jour en direct à chaque clic, sans avoir à fermer la fenêtre de gestion.
  if(typeof refreshRPEDash==='function')refreshRPEDash();
}

function getSessionsForDate(dateKey){
  if(!rpeData||!Array.isArray(rpeData)||rpeData.length<2) return {};
  const currentRoster=ACTIVE_DB.filter(p=>inRosterView(p,cat));
  const isNameInCurrentRoster=name=>currentRoster.some(p=>{
    const nm=canonicalNameKey(p.name),tn=canonicalNameKey(name);
    if(nm===tn)return true;
    return nameWords(name).some(w=>w.length>=3&&nameWords(p.name).includes(w));
  });
  const sessions={};
  rpeData.slice(1).forEach(row=>{
    const k=sheetDateToKey(row[0]);
    if(k!==dateKey) return;
    const type=String(row[2]||'Autre').trim();
    const rpe=parseFloat(row[3]);
    const name=String(row[1]||'').trim();
    if(isRPEEntryDeleted(dateKey,type,name))return;
    if(!isNameInCurrentRoster(name))return;
    if(!sessions[type]) sessions[type]=[];
    sessions[type].push({name,rpe,raw:row});
  });
  return sessions;
}

// ── Weekly sRPE data for chart ──
// "Boyer" seul (sans initiale) est ambigu : il y a Boyer T. et Boyer C. dans l'effectif,
// impossible de savoir à qui attribuer la donnée RPE si le formulaire ne précise pas le prénom.
// On exclut donc totalement cette entrée de tous les calculs plutôt que de risquer une erreur.
function isAmbiguousBoyer(name){
  return normAccent(name)==='boyer';
}

function computeWeeklyLoads(){
  if(!rpeData||!Array.isArray(rpeData)||rpeData.length<2) return [];
  // Même filtre par roster que computeRPEReport : le Sheet RPE est partagé entre équipes.
  const currentRoster=ACTIVE_DB.filter(p=>inRosterView(p,cat));
  const isNameInCurrentRoster=name=>currentRoster.some(p=>{
    const nm=canonicalNameKey(p.name),tn=canonicalNameKey(name);
    if(nm===tn)return true;
    return nameWords(name).some(w=>w.length>=3&&nameWords(p.name).includes(w));
  });
  // Dédupliquer toutes les entrées (même clé et même type par défaut que computeRPEReport)
  const deduped={};
  rpeData.slice(1).forEach(row=>{
    const k=sheetDateToKey(row[0]);
    const name=String(row[1]||'').trim();
    const type=String(row[2]||'Autre').trim();
    if(!k||!name||isAmbiguousBoyer(name)||isRPEEntryDeleted(k,type,name)||!isNameInCurrentRoster(name)) return;
    deduped[name+'_'+k+'_'+type]=row;
  });
  // La moyenne hebdomadaire doit suivre EXACTEMENT les mêmes règles que le bandeau du rapport :
  // on écarte, semaine par semaine, les joueurs blessés/en réhab CETTE semaine-là et ceux exclus
  // manuellement pour CETTE semaine. Sinon le graphique et le bandeau affichent deux chiffres différents.
  const exclCache=new Map();
  const isExcludedThatWeek=(name,wk)=>{
    const key=name+'|'+wk;
    if(!exclCache.has(key))exclCache.set(key,isRPENameInjured(name,wk)||isManuallyExcludedRPE(name,wk));
    return exclCache.get(key);
  };
  const weeks={};
  Object.values(deduped).forEach(row=>{
    const k=sheetDateToKey(row[0]);
    if(!k) return;
    const d=keyToDate(k);
    const wk=dateToWeekStart(d);
    const type=String(row[2]||'Autre').trim();
    const rpe=parseFloat(row[3]);
    if(isNaN(rpe)) return;
    const name=String(row[1]||'').trim();
    if(isExcludedThatWeek(name,wk)) return;
    const dur=getDur(k,type,name); // durée individuelle si définie, sinon durée de la séance
    const srpe=rpe*dur;
    if(!weeks[wk]) weeks[wk]={srpeSum:0,count:0,players:new Set(),hasDur:false};
    weeks[wk].srpeSum+=srpe;
    weeks[wk].count++;
    weeks[wk].players.add(name);
    if(dur>0) weeks[wk].hasDur=true;
  });
  return Object.entries(weeks).sort((a,b)=>a[0].localeCompare(b[0])).map(([wk,v])=>({
    wk, avg:v.count?Math.round(v.srpeSum/v.players.size):0,
    total:Math.round(v.srpeSum), sessions:v.count, players:v.players.size, hasDur:v.hasDur,
    ...weekLabel(wk)
  }));
}

// Signature légère des données, pour ne re-rendre l'écran que si quelque chose a réellement changé.
let rpeDataSig='';
function rpeSignature(d){
  if(!Array.isArray(d))return'';
  const last=d.length?JSON.stringify(d[d.length-1]):'';
  return d.length+'|'+last;
}
// Re-rend les vues RPE visibles SANS perdre la position de défilement de la page.
function refreshRPEViewsKeepScroll(){
  const y=window.scrollY||document.documentElement.scrollTop||0;
  const body2=document.getElementById('rpeBody');
  if(body2) body2.innerHTML=renderRPERows();
  const dash=document.getElementById('rpeDashBody');

  window.scrollTo(0,y);
}
async function loadRPEData(){
  if(rpeLoading)return;
  rpeLoading=true;
  const hadData=Array.isArray(rpeData)&&rpeData.length>1;
  // L'écran de chargement n'apparaît QUE s'il n'y a encore aucune donnée à afficher :
  // une actualisation en arrière-plan ne doit jamais faire disparaître les RPE déjà visibles.
  if(!hadData){
    const body=document.getElementById('rpeBody');
    if(body) body.innerHTML=`<div style="padding:30px;text-align:center;color:var(--text-muted);"><div style="font-size:28px;margin-bottom:8px;">⏳</div>Chargement des données...</div>`;
  }
  let fresh=null;
  try{
    const url=gScriptUrl+'?action=rpe&sheet='+SHEET_ID;
    const resp=await fetch(url,{cache:'no-cache'});
    const data=await resp.json();
    fresh=data.data||data;
  }catch(e){
    fresh={error:'Connexion impossible : '+e.message};
  }
  rpeLoading=false;
  const freshOk=Array.isArray(fresh)&&fresh.length>0;
  if(!freshOk){
    // Échec ou réponse invalide : si on avait déjà des données, on les GARDE (pas d'écrasement).
    if(!hadData){rpeData=fresh;refreshRPEViewsKeepScroll();}
  } else {
    const sig=rpeSignature(fresh);
    const changed=!hadData||sig!==rpeDataSig;
    rpeData=fresh;rpeDataSig=sig;
    if(changed)refreshRPEViewsKeepScroll();
  }
  const badge=document.getElementById('rpeRefreshBadge');
  if(badge){rpeCountdown=30;badge.textContent='↺ dans 30s';}
}

function startRPEAutoRefresh(){
  clearInterval(rpeRefreshTimer);
  rpeCountdown=30;
  if(!rpeData) loadRPEData();
  rpeRefreshTimer=setInterval(()=>{
    if(view!=='rpedata'&&view!=='rpedash'){clearInterval(rpeRefreshTimer);return;}
    rpeCountdown--;
    const badge=document.getElementById('rpeRefreshBadge');
    if(badge) badge.textContent=rpeCountdown>0?`↺ dans ${rpeCountdown}s`:'↺ chargement...';
    if(rpeCountdown<=0){
      const ae=document.activeElement;
      const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
      const modalOpen=document.getElementById('rpeExclusionOverlay')||document.getElementById('rpeWeekPickerOverlay');
      if(typing||modalOpen){rpeCountdown=5;return;} // on repousse plutôt que d'effacer une saisie en cours
      rpeCountdown=30;loadRPEData();
    }
  },1000);
}

function typeColor(type){
  const t=(type||'').toLowerCase();
  if(t.includes('terrain')||t.includes('ter')) return 'var(--alert-watch)';
  if(t.includes('muscu')||t.includes('mus')) return 'var(--alert-warn)';
  if(t.includes('match')||t.includes('mat')) return '#cc0000';
  if(t.includes('course')||t.includes('cardio')||t.includes('sép')) return 'var(--alert-ok)';
  if(t.includes('récup')||t.includes('recup')) return 'var(--ink-soft)';
  return 'var(--primary-dark)';
}
function typeShort(type){
  const t=(type||'').trim();
  if(t.length<=4) return t;
  const map={'Terrain':'Ter','Muscu':'Mus','Match':'Mat','Musculation':'Mus','Course':'Crs','Cardio':'Crd','Récupération':'Réc','Récup':'Réc','Séparation':'Sép'};
  for(const[k,v] of Object.entries(map)) if(t.toLowerCase().includes(k.toLowerCase())) return v;
  return t.slice(0,3);
}

// Détermine si un nom (tel qu'il apparaît dans les réponses RPE) correspond à un joueur
// actuellement blessé ou en réhabilitation, en le reliant au roster de l'équipe sélectionnée.
// Sert à exclure ces joueurs des moyennes de charge (leurs données restent affichées, juste hors calcul).
// Reconstitue si un joueur était blessé/en réhab PENDANT une semaine donnée (pas aujourd'hui),
// à partir des vraies dates de blessure -> date de retour déjà enregistrées dans le module Blessures.
// Même logique d'instantané au lundi que la disponibilité hebdomadaire : une blessure compte pour
// cette semaine seulement si elle avait déjà commencé strictement avant le lundi de cette semaine.
function isRPENameInjured(name,weekStartKey){
  const roster=ACTIVE_DB.filter(p=>inRosterView(p,cat));
  const p=roster.find(pl=>{
    const nm=canonicalNameKey(pl.name),tn=canonicalNameKey(name);
    if(nm===tn)return true;
    return nameWords(name).some(w=>w.length>=3&&nameWords(pl.name).includes(w));
  });
  if(!p)return false;

  // Sans semaine précisée (appel historique), on retombe sur le statut du jour.
  if(!weekStartKey)return getPlayerInjuryStatus(p.name,p.gen)!=='disponible';

  const weekStart=new Date(weekStartKey);
  const today=new Date();today.setHours(0,0,0,0);
  const beforeSeasonStart=new Date(SEASON_START_DATE);beforeSeasonStart.setDate(beforeSeasonStart.getDate()-1);

  const myInjuries=(injuriesDB||[]).filter(x=>{
    const xGen=parseInt(x.gen)||null;
    const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(x.nom)||nameWords(x.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
    if(!nameMatches)return false;
    if(xGen&&p.gen&&xGen!==p.gen)return false;
    return true;
  });

  return myInjuries.some(x=>{
    const stillOngoing=isInjuryOngoing(x);
    if(!x.date&&!stillOngoing)return false;
    const d0=x.date?new Date(x.date):new Date(beforeSeasonStart);
    if(isNaN(d0))return false;
    const d1=x.retour&&!isNaN(new Date(x.retour))?new Date(x.retour):today;
    return d0<weekStart&&d1>weekStart;
  });
}

function computeRPEReport(){
  if(!rpeData||!Array.isArray(rpeData)||rpeData.length<2) return null;
  // Le Google Sheet RPE est partagé entre toutes les équipes (Alamercery/Crabos/Académie) : il faut
  // donc filtrer les lignes sur le roster de l'équipe actuellement sélectionnée AVANT tout calcul,
  // sinon moyennes, séances et détails individuels mélangent toutes les équipes entre elles.
  const currentRoster=ACTIVE_DB.filter(p=>inRosterView(p,cat));
  const isNameInCurrentRoster=name=>currentRoster.some(p=>{
    const nm=canonicalNameKey(p.name),tn=canonicalNameKey(name);
    if(nm===tn)return true;
    return nameWords(name).some(w=>w.length>=3&&nameWords(p.name).includes(w));
  });
  const rows=rpeData.slice(1).filter(r=>isNameInCurrentRoster(String(r[1]||'').trim()));
  const wStart=reportWeekStart||dateToWeekStart(new Date());
  const wEnd=new Date(keyToDate(wStart)); wEnd.setDate(wEnd.getDate()+6);
  const wEndKey=dateToKey(wEnd);

  const weekRows=rows.filter(r=>{const k=sheetDateToKey(r[0]);return k&&k>=wStart&&k<=wEndKey;});

  // ── Dédupliquer : garder la DERNIÈRE réponse par joueur+date+type
  // (évite le double comptage si le formulaire est soumis plusieurs fois)
  const deduped={};
  weekRows.forEach(r=>{
    const k=sheetDateToKey(r[0]);
    const name=String(r[1]||'').trim();
    const type=String(r[2]||'Autre').trim();
    if(!name||!k||isRPEEntryDeleted(k,type,name)) return;
    deduped[name+'_'+k+'_'+type]=r; // écrase les précédentes → dernière entrée gagne
  });
  const uniqueRows=Object.values(deduped);

  const playerWeekLoad={};
  const sessions={};
  const playerSessions={}; // sessions individuelles par joueur, pour le détail RPE dans le rapport
  uniqueRows.forEach(r=>{
    const k=sheetDateToKey(r[0]);
    const name=String(r[1]||'').trim();
    const type=String(r[2]||'Autre').trim();
    const rpe=parseFloat(r[3]);
    if(!name||isNaN(rpe)||isAmbiguousBoyer(name)||isRPEEntryDeleted(k,type,name)) return;
    const dur=getDur(k,type,name); // durée individuelle ou globale
    if(!playerWeekLoad[name]) playerWeekLoad[name]=0;
    playerWeekLoad[name]+=rpe*dur;
    const sk=k+'_'+type;
    if(!sessions[sk]) sessions[sk]={date:k,type,rpeSum:0,count:0};
    sessions[sk].rpeSum+=rpe; sessions[sk].count++;
    if(!playerSessions[name])playerSessions[name]={};
    playerSessions[name][sk]={date:k,type,rpeSum:rpe,count:1};
  });

  const weekLoads=Object.values(playerWeekLoad);
  // Exclut les joueurs actuellement blessés/en réhab, ET les joueurs exclus manuellement,
  // du calcul des moyennes — leurs données restent dans playerWeekLoad pour l'affichage,
  // juste écartées des statistiques d'équipe.
  const injuredNames=new Set(Object.keys(playerWeekLoad).filter(n=>isRPENameInjured(n,wStart)));
  const excludedNames=new Set(Object.keys(playerWeekLoad).filter(n=>isManuallyExcludedRPE(n,wStart)));
  const aptesLoads=Object.entries(playerWeekLoad).filter(([n])=>!injuredNames.has(n)&&!excludedNames.has(n)).map(([,v])=>v);
  const avgWeekLoad=aptesLoads.length?Math.round(aptesLoads.reduce((a,b)=>a+b,0)/aptesLoads.length):0;

  // Saison : dédupliquer aussi
  const dedupedAll={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);
    const name=String(r[1]||'').trim();
    const type=String(r[2]||'Autre').trim();
    if(!name||!k||isAmbiguousBoyer(name)||isRPEEntryDeleted(k,type,name)) return;
    dedupedAll[name+'_'+k+'_'+type]=r;
  });
  const playerSeason={};
  Object.values(dedupedAll).forEach(r=>{
    const k=sheetDateToKey(r[0]);
    const name=String(r[1]||'').trim();
    const type=String(r[2]||'Autre').trim();
    const rpe=parseFloat(r[3]);
    if(!name||isNaN(rpe)||isAmbiguousBoyer(name)||isRPEEntryDeleted(k,type,name)) return;
    const dur=getDur(k,type,name);
    if(!playerSeason[name]) playerSeason[name]=0;
    playerSeason[name]+=rpe*dur;
  });

  // ── Semaine précédente ──
  const prevWkDate=new Date(keyToDate(wStart));
  prevWkDate.setDate(prevWkDate.getDate()-7);
  const prevStart=dateToWeekStart(prevWkDate);
  const prevEndDate=new Date(keyToDate(wStart));
  prevEndDate.setDate(prevEndDate.getDate()-1);
  const prevEndKey=dateToKey(prevEndDate);
  const dp={};
  rows.filter(r=>{const k=sheetDateToKey(r[0]);return k&&k>=prevStart&&k<=prevEndKey;})
    .forEach(r=>{const k=sheetDateToKey(r[0]);const n=String(r[1]||'').trim();const t=String(r[2]||'Autre').trim();if(!n||!k||isAmbiguousBoyer(n)||isRPEEntryDeleted(k,t,n))return;dp[n+'_'+k+'_'+t]=r;});
  const playerPrevWeekLoad={};
  Object.values(dp).forEach(r=>{
    const k=sheetDateToKey(r[0]);const n=String(r[1]||'').trim();const t=String(r[2]||'Autre').trim();const rpe=parseFloat(r[3]);
    if(!n||isNaN(rpe))return;
    playerPrevWeekLoad[n]=(playerPrevWeekLoad[n]||0)+rpe*getDur(k,t,n);
  });

  const injuredNamesPrev=new Set(Object.keys(playerPrevWeekLoad).filter(n=>isRPENameInjured(n,prevStart)));
  const excludedNamesPrev=new Set(Object.keys(playerPrevWeekLoad).filter(n=>isManuallyExcludedRPE(n,prevStart)));
  const aptesPrevLoads=Object.entries(playerPrevWeekLoad).filter(([n])=>!injuredNamesPrev.has(n)&&!excludedNamesPrev.has(n)).map(([,v])=>v);
  const avgPrevWeekLoad=aptesPrevLoads.length?Math.round(aptesPrevLoads.reduce((a,b)=>a+b,0)/aptesPrevLoads.length):0;

  return{avgWeekLoad,avgPrevWeekLoad,injuredNames,excludedNames,sessions,playerSessions,playerSeason,playerWeekLoad,playerPrevWeekLoad,weeklyLoads:computeWeeklyLoads(),wStart,wEndKey};
}

function changeReportWeek(delta){
  const current=reportWeekStart||dateToWeekStart(new Date());

  if(view==='rpereport') r.innerHTML=bRPEReport();

function svgAllPlayersComparison(curLoad, prevLoad, injuredNames){
  injuredNames=injuredNames||new Set();
  const allNames=[...new Set([...Object.keys(curLoad),...Object.keys(prevLoad)])].filter(n=>n).sort();
  const hasData=allNames.some(n=>(curLoad[n]||0)+(prevLoad[n]||0)>0);
  if(!allNames.length||!hasData) return`<div style="color:var(--text-muted);text-align:center;padding:20px;font-size:12px;">Saisis les durées de séances pour voir les charges.</div>`;

  const aptes=allNames.filter(n=>!injuredNames.has(n));
  const blesses=allNames.filter(n=>injuredNames.has(n));

  function chartFor(names,title,subtitle){
    if(!names.length)return'';
    const BW=20,GAP=4,GW=BW*2+GAP+14;
    const PL=44,PR=10,PT=26,PB=56;
    const W=PL+names.length*GW+PR;
    const H=260;
    const maxV=Math.max(...names.map(n=>Math.max(curLoad[n]||0,prevLoad[n]||0)),1);
    const yS=(H-PT-PB)/maxV;
    const bH=v=>Math.max(2,Math.round(v*yS));
    const xG=i=>PL+i*GW;
    const fmt=v=>v>=1000?Math.round(v/100)/10+'k':Math.round(v);
    const bars=names.map((n,i)=>{
      const cur=curLoad[n]||0, prev=prevLoad[n]||0;
      const gx=xG(i);
      const sn=n.length>10?n.slice(0,9)+'…':n;
      return`${cur>0?`<rect x="${gx}" y="${H-PB-bH(cur)}" width="${BW}" height="${bH(cur)}" rx="3" fill="#cc0000"/>
      <text x="${gx+BW/2}" y="${H-PB-bH(cur)-5}" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">${fmt(cur)}</text>`:''}
      ${prev>0?`<rect x="${gx+BW+GAP}" y="${H-PB-bH(prev)}" width="${BW}" height="${bH(prev)}" rx="3" fill="#555"/>
      <text x="${gx+BW+GAP+BW/2}" y="${H-PB-bH(prev)-5}" text-anchor="middle" font-size="10" fill="#aaa">${fmt(prev)}</text>`:''}
      <text x="${gx+BW+GAP/2}" y="${H-PB+16}" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(-40,${gx+BW+GAP/2},${H-PB+16})">${sn}</text>`;
    }).join('');
    const yLines=[0.25,0.5,0.75,1.0].map(f=>{const v=Math.round(maxV*f);const y=H-PB-Math.round(v*yS);return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e1e" stroke-width="1"/>
    <text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="#555">${fmt(v)}</text>`;}).join('');
    return`<div style="margin-bottom:16px;">
      <div style="font-size:12px;font-weight:700;color:${title.includes('Blessé')?'var(--primary)':'var(--alert-ok)'};margin-bottom:2px;">${title}</div>
      ${subtitle?`<div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;">${subtitle}</div>`:''}
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;">
        <svg viewBox="0 0 ${W} ${H}" style="width:${Math.max(W,360)}px;height:${H}px;">
          ${yLines}
          <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#333"/>
          ${bars}
        </svg>
      </div>
    </div>`;
  }

  return`
    ${chartFor(aptes,'🟢 Joueurs aptes','Comptent dans le calcul des moyennes')}
    ${chartFor(blesses,"🔴 Joueurs blessés / en réhabilitation","Données affichées à titre indicatif — exclues des moyennes d'équipe")}
    <div style="display:flex;gap:12px;justify-content:center;margin-top:4px;">
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:12px;height:12px;background:#cc0000;border-radius:2px;"></div><span style="font-size:10px;color:var(--text-muted);">Semaine en cours</span></div>
      <div style="display:flex;align-items:center;gap:5px;"><div style="width:12px;height:12px;background:#555;border-radius:2px;"></div><span style="font-size:10px;color:var(--text-muted);">Semaine précédente</span></div>
    </div>`;
}

function svgWeekRPE(sessions, filterTypes=null){
  const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const sorted=Object.values(sessions)
    .filter(s=>!filterTypes||filterTypes.size===0||filterTypes.has(s.type))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.type.localeCompare(b.type));
  if(!sorted.length) return`<div style="color:var(--text-muted);text-align:center;padding:16px;font-size:12px;">Aucune séance cette semaine.</div>`;
  const W=340,H=120,PL=22,PR=6,PT=18,PB=42;
  const n=sorted.length;
  const cW=(W-PL-PR)/n;
  const bW=Math.max(10,Math.min(26,cW-5));
  const maxV=10;
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+(cW-bW)/2;
  const bH=(v)=>Math.max(2,Math.round(v*yS));
  const bars=sorted.map((s,i)=>{
    const avg=s.rpeSum/s.count;
    const d=keyToDate(s.date);
    const jour=JOURS[d.getDay()];
    const typS=typeShort(s.type);
    const col=typeColor(s.type);
    const bx=x(i), by=H-PB-bH(avg);
    return`
    <rect x="${bx}" y="${by}" width="${bW}" height="${bH(avg)}" rx="3" fill="${col}"/>
    <text x="${bx+bW/2}" y="${by-3}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">${avg.toFixed(1)}</text>
    <text x="${bx+bW/2}" y="${H-PB+11}" text-anchor="middle" font-size="8" font-weight="700" fill="#ccc">${jour}</text>
    <text x="${bx+bW/2}" y="${H-PB+21}" text-anchor="middle" font-size="7.5" fill="${col}">${typS}</text>`;
  }).join('');
  const yLines=[0,2,4,6,8,10].map(v=>`
    <line x1="${PL}" y1="${H-PB-bH(v)}" x2="${W-PR}" y2="${H-PB-bH(v)}" stroke="#1e1e1e" stroke-width="1"/>

  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    ${yLines}

function svgBarWeekly(weeklyLoads){
  // Fenêtre fixe : commence à la semaine calendaire S36, jusqu'à la semaine sélectionnée.
  let recent=weeklyLoads.filter(w=>w.hasDur&&w.week>=36);
  if(!recent.length) return`<div style="color:var(--text-muted);text-align:center;padding:20px;font-size:12px;">Saisis les durées de séances pour activer ce graphique.</div>`;
  const wStart=reportWeekStart||dateToWeekStart(new Date());
  const W=Math.max(380,recent.length*70+60),H=200,PL=42,PR=14,PT=28,PB=38;
  const cW=(W-PL-PR)/recent.length;
  const maxV=Math.max(...recent.map(w=>w.avg),1);
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+cW/2;
  const y=(v)=>H-PB-Math.round(v*yS);
  const col=(v)=>v>=600?'#cc0000':v>=400?'var(--alert-warn)':v>=200?'var(--alert-watch)':'var(--alert-ok)';
  const points=recent.map((w,i)=>{
    const isCurrentWeek=w.wk===wStart;
    const px=x(i),py=y(w.avg);
    return`<g>
      ${w.avg>0?`<text x="${px}" y="${py-14}" text-anchor="middle" font-size="12" font-weight="800" fill="${isCurrentWeek?'#fff':'#ccc'}">${Math.round(w.avg)}</text>`:''}
      <circle cx="${px}" cy="${py}" r="${isCurrentWeek?8:6}" fill="${col(w.avg)}" stroke="#fff" stroke-width="${isCurrentWeek?2:1.2}"/>
      <text x="${px}" y="${H-PB+16}" text-anchor="middle" font-size="10" font-weight="${isCurrentWeek?'700':'400'}" fill="${isCurrentWeek?'#cc0000':'#777'}">${w.label}</text>
    </g>`;
  }).join('');
  const polyline=`<polyline points="${recent.map((w,i)=>`${x(i)},${y(w.avg)}`).join(' ')}" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-opacity="0.4"/>`;
  const yLines=[0,200,400,600].filter(v=>v<=maxV*1.15).map(v=>`
    <line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="${PL-6}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#555">${v}</text>`).join('');
  return`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${W}px;">
      ${yLines}
      ${polyline}
      ${points}
    </svg>
  </div>`;
}

function svgBarPlayers(playerData){
  const sorted=Object.entries(playerData).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,25);
  if(!sorted.length) return`<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:16px;">Aucune charge calculée pour cette semaine.<br><span style="font-size:10px;color:var(--text-muted);">Saisis les durées de séances dans le suivi journalier.</span></div>`;
  const W=340,rowH=20,PL=78,PR=10;
  const H=sorted.length*rowH+12;
  const maxV=sorted[0][1];
  const bW=W-PL-PR;
  const col=(v)=>v>=2000?'#cc0000':v>=1000?'var(--alert-warn)':v>=500?'var(--alert-watch)':'var(--alert-ok)';
  const bars=sorted.map(([name,val],i)=>{
    const w=Math.round((val/maxV)*bW);
    const y=6+i*rowH;
    const shortName=name.length>11?name.slice(0,10)+'…':name;
    return`<text x="${PL-4}" y="${y+13}" text-anchor="end" font-size="9" fill="#aaa">${shortName}</text>
    <rect x="${PL}" y="${y+2}" width="${w}" height="${rowH-5}" rx="2" fill="${col(val)}"/>
    <text x="${PL+w+3}" y="${y+13}" font-size="9" fill="#777">${val>999?Math.round(val/100)/10+'k':Math.round(val)}</text>`;
  }).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;">${bars}</svg>`;
}

function svgPlayerWeeklyLine(rows){
  const weeks={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);if(!k)return;
    const wk=dateToWeekStart(keyToDate(k));
    const type=String(r[2]||'').trim();
    const rpe=parseFloat(r[3]);
    const pname=String(r[1]||'').trim();
    const dur=getDur(k,type,pname);
    if(!weeks[wk]) weeks[wk]={srpe:0,hasDur:false,label:weekLabel(wk).label};
    weeks[wk].srpe+=rpe*dur;
    if(dur>0) weeks[wk].hasDur=true;
  });
  const sorted=Object.entries(weeks).sort((a,b)=>a[0].localeCompare(b[0]));
  const wd=sorted.filter(([,v])=>v.hasDur);
  if(wd.length<2) return`<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:12px;">Saisis les durées pour activer ce graphique.</div>`;
  const W=340,H=130,PL=34,PR=10,PT=16,PB=24;
  const n=wd.length;
  const vals=wd.map(([,v])=>v.srpe);
  const maxV=Math.max(...vals,1);
  const xs=(W-PL-PR)/Math.max(1,n-1);
  const ys=(H-PT-PB)/maxV;
  const curWk=dateToWeekStart(new Date());
  const pts=wd.map(([wk,v],i)=>({x:PL+i*xs,y:H-PB-v.srpe*ys,wk,v,isCur:wk===curWk}));
  const pathD=pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
  const areaD=`${pathD} L${pts[pts.length-1].x},${H-PB} L${pts[0].x},${H-PB} Z`;
  const skip=Math.max(1,Math.floor(n/7));
  const dots=pts.map((p,i)=>`
    <circle cx="${p.x}" cy="${p.y}" r="${p.isCur?5.5:3}" fill="${p.isCur?'#cc0000':'var(--alert-watch)'}" stroke="${p.isCur?'#fff':'#333'}" stroke-width="${p.isCur?2:1}"/>
    ${p.isCur||i===0||i===n-1||i%skip===0?`<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="7" fill="${p.isCur?'#cc0000':'#888'}" font-weight="${p.isCur?'bold':'normal'}">${Math.round(p.v.srpe)>999?Math.round(p.v.srpe/100)/10+'k':Math.round(p.v.srpe)}</text>
    <text x="${p.x}" y="${H-PB+12}" text-anchor="middle" font-size="7" fill="${p.isCur?'#cc0000':'#555'}">${p.v.label}</text>`:''}
  `).join('');
  const yLines=[200,400,600].filter(v=>v<=maxV).map(v=>`
    <line x1="${PL}" y1="${H-PB-v*ys}" x2="${W-PR}" y2="${H-PB-v*ys}" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="${PL-3}" y="${H-PB-v*ys+3}" text-anchor="end" font-size="7" fill="#444">${v}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    ${yLines}
    <path d="${areaD}" fill="#cc0000" opacity="0.07"/>
    <path d="${pathD}" stroke="#cc0000" stroke-width="1.5" fill="none" opacity="0.8"/>
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#333"/>
    ${dots}
  </svg>`;
}

function renderCurrentWeekDetail(name){

  if(!rows.length) return`<div style="color:var(--text-muted);font-size:12px;padding:12px;text-align:center;">Aucune séance cette semaine.</div>`;

  const loadColor=total>=600?'#cc0000':total>=400?'var(--alert-warn)':total>=200?'var(--alert-watch)':'var(--alert-ok)';

    <div style="padding:10px;text-align:center;border-right:1px solid #222;">

      <div style="font-size:9px;color:var(--text-muted);">séances</div>
    </div>
    <div style="padding:10px;text-align:center;border-right:1px solid #222;">
      <div style="font-size:15px;font-weight:800;color:${rpeColor(avgRPE)}">${avgRPE}</div>

function computeACWR(rows){
  // Acute (7j) / Chronic (28j) Workload Ratio
  const today=new Date();
  const d7=new Date(today); d7.setDate(d7.getDate()-7);
  const d28=new Date(today); d28.setDate(d28.getDate()-28);
  const key7=dateToKey(d7), key28=dateToKey(d28), keyNow=dateToKey(today);
  let sum7=0,sum28=0,n28=0;
  const weeks28={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);if(!k) return;
    const type=String(r[2]||'').trim();
    const rpe=parseFloat(r[3]);
    const name=String(r[1]||'').trim();
    const dur=getDur(k,type,name);
    const srpe=rpe*dur;
    if(k>=key7&&k<=keyNow) sum7+=srpe;
    if(k>=key28&&k<=keyNow){
      const wk=dateToWeekStart(keyToDate(k));
      if(!weeks28[wk]) weeks28[wk]=0;
      weeks28[wk]+=srpe;
    }
  });
  const wkVals=Object.values(weeks28);
  const chronic=wkVals.length?wkVals.reduce((a,b)=>a+b,0)/wkVals.length:0;
  const acwr=chronic>0?(sum7/chronic).toFixed(2):null;
  return{acwr,acute:Math.round(sum7),chronic:Math.round(chronic)};
}

function renderIndividualRPE(name){

    .sort((a,b)=>(sheetDateToKey(a[0])||'').localeCompare(sheetDateToKey(b[0])||''));
  if(!rows.length) return`<div style="color:var(--text-muted);text-align:center;padding:20px;font-size:12px;">Aucune donnée pour ce joueur.</div>`;

  const rpes=rows.map(r=>parseFloat(r[3])).filter(v=>!isNaN(v));
  const avgRPE=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'-';
  const maxRPE=rpes.length?Math.max(...rpes):'-';

  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);

  const last5=rpes.slice(-5), prev5=rpes.slice(-10,-5);
  const avgLast=last5.length?(last5.reduce((a,b)=>a+b,0)/last5.length).toFixed(1):null;
  const avgPrev=prev5.length?(prev5.reduce((a,b)=>a+b,0)/prev5.length).toFixed(1):null;

      ${[...new Set(rows.map(r=>String(r[2]||'').trim()))].map(t=>`<span style="font-size:9px;background:${typeColor(t)}22;color:${typeColor(t)};border:1px solid ${typeColor(t)}44;padding:2px 7px;border-radius:8px;">${t}</span>`).join('')}
    </div>
  </div>`;
}

function getUniqueRPEPlayers(){
  if(!rpeData||rpeData.length<2) return [];
  return[...new Set(rpeData.slice(1).map(r=>String(r[1]||'').trim()).filter(n=>n))].sort();
}

function computeTeamStats(){
  if(!rpeData||rpeData.length<2) return null;
  const rows=rpeData.slice(1);
  const rpes=rows.map(r=>parseFloat(r[3])).filter(v=>!isNaN(v));
  const avgRPE=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'0';
  const weeks={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);if(!k)return;
    const wk=dateToWeekStart(keyToDate(k));
    const type=String(r[2]||'').trim();
    const rpe=parseFloat(r[3]);
    const dur=sessionDurations[k+'_'+type]||0;
    if(!weeks[wk]) weeks[wk]={srpe:0,players:new Set()};
    weeks[wk].srpe+=rpe*dur;
    weeks[wk].players.add(String(r[1]||'').trim());
  });
  const wkAvgs=Object.values(weeks).filter(w=>w.players.size>0).map(w=>w.srpe/w.players.size);
  const avgWeekLoad=wkAvgs.length?Math.round(wkAvgs.reduce((a,b)=>a+b,0)/wkAvgs.length):0;
  return{avgRPE,avgWeekLoad};
}

function svgPrevVsCurrent(rows){
  const today=new Date();
  const curWk=dateToWeekStart(today);
  const prevWkDate=new Date(keyToDate(curWk));prevWkDate.setDate(prevWkDate.getDate()-7);
  const prevWk=dateToWeekStart(prevWkDate);
  const prevEndDate=new Date(keyToDate(curWk));prevEndDate.setDate(prevEndDate.getDate()-1);
  const prevEndKey=dateToKey(prevEndDate);
  const curEndDate=new Date(today);curEndDate.setDate(curEndDate.getDate()+(6-(today.getDay()||7)+1));
  const curEndKey=dateToKey(curEndDate);
  const prevByType={},curByType={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);if(!k)return;
    const type=String(r[2]||'Autre').trim();
    const rpe=parseFloat(r[3]);
    const dur=sessionDurations[k+'_'+type]||0;
    const srpe=rpe*dur;
    if(k>=prevWk&&k<=prevEndKey){if(!prevByType[type])prevByType[type]=0;prevByType[type]+=srpe;}
    else if(k>=curWk&&k<=curEndKey){if(!curByType[type])curByType[type]=0;curByType[type]+=srpe;}
  });
  const totalPrev=Object.values(prevByType).reduce((a,b)=>a+b,0);
  const totalCur=Object.values(curByType).reduce((a,b)=>a+b,0);
  const types=[...new Set([...Object.keys(prevByType),...Object.keys(curByType)])];
  if(!totalPrev&&!totalCur) return`<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:12px;">Saisis les durées pour voir les charges.</div>`;
  const W=340,H=140,PL=32,PR=10,PT=20,PB=28;
  const maxV=Math.max(totalPrev,totalCur,1);
  const yS=(H-PT-PB)/maxV;
  const bW=60,gap=24;
  const xPrev=PL+(W-PL-PR-bW*2-gap)/2;
  const xCur=xPrev+bW+gap;
  const stackBars=(byType,xStart)=>types.reduce((acc,t)=>{
    const v=byType[t]||0;if(!v)return acc;
    const bh=Math.max(2,Math.round(v*yS));
    acc.svg+=`<rect x="${xStart}" y="${H-PB-acc.y-bh}" width="${bW}" height="${bh}" fill="${typeColor(t)}" opacity="0.9"/>`;
    acc.y+=bh;return acc;
  },{y:0,svg:''}).svg;
  const delta=totalCur-totalPrev;
  const deltaCol=delta>50?'var(--alert-crit)':delta<-50?'var(--alert-ok)':'#888';
  const yLines=[200,400,600].filter(v=>v<=maxV*1.1).map(v=>`
    <line x1="${PL}" y1="${H-PB-Math.round(v*yS)}" x2="${W-PR}" y2="${H-PB-Math.round(v*yS)}" stroke="#1e1e1e" stroke-width="1"/>
    <text x="${PL-2}" y="${H-PB-Math.round(v*yS)+3}" text-anchor="end" font-size="7" fill="#444">${v}</text>`).join('');
  return`<div style="text-align:center;margin-bottom:8px;">
    <span style="font-size:15px;font-weight:800;color:${deltaCol};">${(delta>0?'+':'')+Math.round(delta)} UA</span>
    <span style="font-size:10px;color:var(--text-muted);margin-left:6px;">vs semaine précédente</span>
  </div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    ${yLines}
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#333"/>
    ${stackBars(prevByType,xPrev)}${stackBars(curByType,xCur)}
    ${totalPrev>0?`<text x="${xPrev+bW/2}" y="${H-PB-Math.round(totalPrev*yS)-5}" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">${Math.round(totalPrev)}</text>`:''}
    ${totalCur>0?`<text x="${xCur+bW/2}" y="${H-PB-Math.round(totalCur*yS)-5}" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">${Math.round(totalCur)}</text>`:''}
    <text x="${xPrev+bW/2}" y="${H-PB+13}" text-anchor="middle" font-size="9" fill="#888">Sem. précédente</text>
    <text x="${xCur+bW/2}" y="${H-PB+13}" text-anchor="middle" font-size="9" fill="#cc0000" font-weight="bold">Sem. en cours</text>
  </svg>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px;">
    ${types.map(t=>`<span style="font-size:9px;background:${typeColor(t)}22;color:${typeColor(t)};border:1px solid ${typeColor(t)}44;padding:2px 7px;border-radius:8px;">${t}</span>`).join('')}
  </div>`;
}

function svgPlayerSessions(rows){
  const sorted=rows.slice(-30); // dernières 30 séances max
  if(!sorted.length) return '';
  const W=340,H=110,PL=22,PR=6,PT=18,PB=28;
  const n=sorted.length;
  const cW=(W-PL-PR)/n;
  const bW=Math.max(6,Math.min(18,cW-3));
  const maxV=10;
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+(cW-bW)/2;
  const bH=(v)=>Math.max(2,Math.round(v*yS));
  const JOURS=['D','L','Ma','Me','J','V','S'];
  const bars=sorted.map((r,i)=>{
    const rpe=parseFloat(r[3]);
    const k=sheetDateToKey(r[0]);
    const d=k?keyToDate(k):null;
    const col=typeColor(String(r[2]||''));
    const jour=d?JOURS[d.getDay()]:'';
    return`<rect x="${x(i)}" y="${H-PB-bH(rpe)}" width="${bW}" height="${bH(rpe)}" rx="2" fill="${col}" opacity="0.9"/>
    <text x="${x(i)+bW/2}" y="${H-PB-bH(rpe)-2}" text-anchor="middle" font-size="7" fill="#fff">${isNaN(rpe)?'':rpe}</text>
    ${i%Math.max(1,Math.floor(n/8))===0?`<text x="${x(i)+bW/2}" y="${H-PB+10}" text-anchor="middle" font-size="7" fill="#555">${jour}</text>`:''}`;
  }).join('');
  const yLines=[0,2,4,6,8,10].map(v=>`
    <line x1="${PL}" y1="${H-PB-bH(v)}" x2="${W-PR}" y2="${H-PB-bH(v)}" stroke="#1a1a1a" stroke-width="1"/>
    <text x="${PL-2}" y="${H-PB-bH(v)+3}" text-anchor="end" font-size="7" fill="#333">${v}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    ${yLines}<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#333"/>
    ${bars}</svg>`;
}

function svgPlayerWeekly(rows){
  const weeks={};
  rows.forEach(r=>{
    const k=sheetDateToKey(r[0]);
    if(!k) return;
    const wk=dateToWeekStart(keyToDate(k));
    const type=String(r[2]||'').trim();
    const rpe=parseFloat(r[3]);
    const dur=sessionDurations[k+'_'+type]||0;
    if(!weeks[wk]) weeks[wk]={srpe:0,hasDur:false,label:weekLabel(wk).label};
    weeks[wk].srpe+=rpe*dur;
    if(dur>0) weeks[wk].hasDur=true;
  });
  const sorted=Object.entries(weeks).sort((a,b)=>a[0].localeCompare(b[0])).filter(([,v])=>v.hasDur).slice(-12);
  if(!sorted.length) return`<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:10px;">Saisis les durées pour activer ce graphique.</div>`;
  const W=340,H=100,PL=28,PR=6,PT=8,PB=22;
  const n=sorted.length;
  const cW=(W-PL-PR)/n;
  const bW=Math.max(8,Math.min(20,cW-4));
  const maxV=Math.max(...sorted.map(([,v])=>v.srpe),1);
  const yS=(H-PT-PB)/maxV;
  const x=(i)=>PL+i*cW+(cW-bW)/2;
  const bH=(v)=>Math.max(2,Math.round(v*yS));
  const col=(v)=>v>=600?'#cc0000':v>=400?'var(--alert-warn)':v>=200?'var(--alert-watch)':'var(--alert-ok)';
  const bars=sorted.map(([wk,v],i)=>
    `<rect x="${x(i)}" y="${H-PB-bH(v.srpe)}" width="${bW}" height="${bH(v.srpe)}" rx="2" fill="${col(v.srpe)}"/>
    <text x="${x(i)+bW/2}" y="${H-PB-bH(v.srpe)-2}" text-anchor="middle" font-size="7" fill="#ccc">${v.srpe>999?Math.round(v.srpe/100)/10+'k':Math.round(v.srpe)}</text>
    <text x="${x(i)+bW/2}" y="${H-PB+11}" text-anchor="middle" font-size="7" fill="#555">${v.label}</text>`
  ).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;">
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#333"/>
    ${bars}</svg>`;
}

function toggleRPEWeekFilter(type){
  if(type==='all'){
    rpeWeekFilters.clear();
  } else {
    if(rpeWeekFilters.has(type)) rpeWeekFilters.delete(type);
    else rpeWeekFilters.add(type);
    const allTypes=[...new Set(Object.values(weekSessionsCache).map(s=>s.type))];
    if(allTypes.length&&allTypes.every(t=>rpeWeekFilters.has(t))) rpeWeekFilters.clear();
  }
  const chart=document.getElementById('weekRPEChartSvg');
  const btns=document.getElementById('weekRPEFilterBtns');
  if(chart) chart.innerHTML=svgWeekRPE(weekSessionsCache,rpeWeekFilters);
  if(btns) btns.innerHTML=renderRPEFilterBtns();
}

function renderRPEFilterBtns(){
  const allTypes=[...new Set(Object.values(weekSessionsCache).map(s=>s.type))].sort();
  const showAll=rpeWeekFilters.size===0;
  const btn=(label,type,active,col)=>`<button onclick="toggleRPEWeekFilter('${type}')"
    style="padding:6px 12px;border-radius:16px;border:1.5px solid ${active?col:'#2a2a2a'};
    background:${active?col+'22':'transparent'};color:${active?col:'#555'};
    font-size:11px;font-weight:${active?'700':'400'};cursor:pointer;white-space:nowrap;">
    ${active?'✓ ':''}${label}</button>`;
  return btn('Tout','all',showAll,'#fff')+allTypes.map(t=>btn(t,t,rpeWeekFilters.has(t),typeColor(t))).join('');
}

// Visuel combiné "SEMAINE X" : grosses boîtes de comparaison sem. précédente / sem. actuelle
// + pourcentage d'évolution + courbe de tendance complète, dans l'esprit du visuel de référence.
function svgWeekComparisonBanner(avgPrevWeekLoad,avgWeekLoad,weeklyLoads,weekNum){
  const delta=avgPrevWeekLoad?Math.round(((avgWeekLoad-avgPrevWeekLoad)/avgPrevWeekLoad)*100):null;
  const deltaColor=delta===null?'var(--text-muted)':delta>10?'var(--primary)':delta<-10?'var(--alert-ok)':'var(--alert-watch)';
  const deltaIcon=delta===null?'':delta>0?'▲':delta<0?'▼':'●';

  const wStart=reportWeekStart||dateToWeekStart(new Date());
  let recent=weeklyLoads.filter(w=>w.hasDur);
  const curIdx=recent.findIndex(w=>w.wk===wStart);
  if(curIdx>=0)recent=recent.slice(Math.max(0,curIdx-9),curIdx+1);
  else recent=recent.slice(-10);

  return`
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-size:22px;font-weight:900;color:var(--primary);letter-spacing:2px;">SEMAINE ${weekNum||''}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:18px;">
      <div style="text-align:center;">
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Semaine précédente</div>
        <div style="background:#000;border-radius:12px;padding:16px 8px;font-size:26px;font-weight:800;color:#fff;">${avgPrevWeekLoad||'—'}</div>
      </div>
      <div style="text-align:center;padding:0 4px;">
        ${delta!==null?`<div style="font-size:13px;font-weight:800;color:${deltaColor};margin-bottom:4px;">${deltaIcon} ${delta>0?'+':''}${delta}%</div>`:''}
        <div style="font-size:20px;color:${deltaColor};">→</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Semaine actuelle</div>
        <div style="background:var(--primary);border-radius:12px;padding:16px 8px;font-size:26px;font-weight:800;color:#fff;">${avgWeekLoad||'—'}</div>
      </div>
    </div>
    ${svgBarWeekly(weeklyLoads)}
  `;
}

function bRPEReport(){

  const wStart=reportWeekStart||dateToWeekStart(new Date());

  </div>`;
  }catch(err){
    return navBar(true,cat)+`<div style="padding:20px;background:var(--surface2);min-height:100vh;">
      <div style="background:#1a0000;border:1px solid #cc0000;border-radius:10px;padding:16px;margin-bottom:16px;">

// ═══════════════════════════════════════════════════════
//  WELLNESS — BIEN-ÊTRE JOUEURS
// ═══════════════════════════════════════════════════════
// Joueurs qui remplissent le Wellness
// Liste Wellness = tous les joueurs Alamercery (dynamique, plus de liste en dur)
function getWellnessPlayers(){
  return ACTIVE_DB
    .filter(p=>inRosterView(p,window._ctxCat||'Alamercery'))
    .map(p=>p.name)
    .sort();
}

const W_INDICATORS=[
  {key:'sommeil',label:'Sommeil',  icon:'😴',col:2,invert:false},
  {key:'stress', label:'Stress',   icon:'😰',col:3,invert:true},
  {key:'cbas',   label:'Courb. bas',icon:'🦵',col:4,invert:true},
  {key:'chaut',  label:'Courb. haut',icon:'💪',col:5,invert:true},
  {key:'fatigue',label:'Fatigue',  icon:'😓',col:6,invert:true},
];

function wDateKey(ts){
  if(!ts)return null;
  if(ts instanceof Date)return dateToKey(ts);
  const s=String(ts).trim();
  if(s.match(/^\d{4}-\d{2}-\d{2}T/))return dateToKey(new Date(s));
  if(s.match(/^\d{4}-\d{2}-\d{2}/))return s.slice(0,10);
  const p=s.split(' ')[0].split('/');
  if(p.length===3&&p[2].length===4)return`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
  return null;
}

// Échelle Hooper 1 (excellent) à 7 (critique)
const HOOPER_LABELS=['','Excellent','Très bon','Bon','Correct','Moyen','Mauvais','Critique'];
function wIndColor(val){
  const v=Math.round(parseFloat(val));
  return({1:'#1a7a1a',2:'#44cc44',3:'#88cc44',4:'#ffcc00',5:'#ff9900',6:'#ff9900',7:'#cc0000'})[v]||'#888';
}
function wIndBg(val){
  const v=Math.round(parseFloat(val));
  return v<=1?'#0a2a0a':v<=2?'#0d2a0d':v<=3?'#1a2a0a':v===4?'#2a2000':v===5?'#2a1500':v===6?'#2a1000':'#2a0000';
}
function formeAbsolue(score){return((35-score)/30)*100;}

// Construit, par joueur, la série triée de toutes ses réponses (dédupliquées par jour)
function buildWellnessSeries(allRows){
  // Construit un index des joueurs Alamercery par clé canonique → nom réel dans l'app
  const rosterIndex={};
  getWellnessPlayers().forEach(n=>rosterIndex[canonicalNameKey(n)]=n);

  const byPlayer={};
  for(const r of allRows){
    const rawName=String(r[1]||'').trim();
    if(!rawName)continue;
    const dateKey=wDateKey(r[0]);
    if(!dateKey)continue;
    const vals=W_INDICATORS.map(ind=>parseFloat(r[ind.col]));
    if(vals.some(v=>isNaN(v)))continue;
    const score=vals.reduce((a,b)=>a+b,0);
    // Résout le nom via clé canonique (insensible casse/ordre) → nom du roster
    const ck=canonicalNameKey(rawName);
    const name=rosterIndex[ck]||rawName;
    const remarque=String(r[7]||'').trim();
    if(!byPlayer[name])byPlayer[name]={};
    byPlayer[name][dateKey]={date:dateKey,vals,score,forme:formeAbsolue(score),remarque};
  }
  const result={};
  for(const[name,obj]of Object.entries(byPlayer)) result[name]=Object.values(obj).sort((a,b)=>a.date.localeCompare(b.date));
  return result;
}

function computeMetricsAt(series,idx){
  const entry=series[idx];
  const w21=series.slice(Math.max(0,idx-20),idx+1);
  const w3=series.slice(Math.max(0,idx-2),idx+1);
  let ecart21=null,var3=null,avg21=null,avg3=null;
  if(w21.length>=3){avg21=w21.reduce((a,e)=>a+e.score,0)/w21.length;ecart21=((entry.score-avg21)/avg21)*100;}
  if(w3.length>=2){avg3=w3.reduce((a,e)=>a+e.score,0)/w3.length;var3=((entry.score-avg3)/avg3)*100;}
  return{score:entry.score,forme:entry.forme,ecart21,var3,avg21,avg3};
}

function computePersistance(series,idx){
  let count=0;
  for(let i=idx;i>=0;i--){
    const m=computeMetricsAt(series,i);
    const bad=m.forme<60||(m.ecart21!==null&&m.ecart21>10);
    if(bad)count++;else break;
  }
  return count;
}

function classifyStatus(m,entry,persistance){
  const[sommeil,stress,cbas,chaut,fatigue]=entry.vals;
  const crit=[sommeil,stress,fatigue];
  if(m.forme<30||(m.ecart21!==null&&m.ecart21>30)||(m.var3!==null&&m.var3>30)||crit.some(v=>v===7)||persistance>=7) return'rouge';
  if((m.forme>=30&&m.forme<45)||(m.ecart21!==null&&m.ecart21>=20&&m.ecart21<=30)||(m.var3!==null&&m.var3>=20&&m.var3<=30)||crit.some(v=>v===6)||persistance>=5) return'orange';
  if((m.forme>=45&&m.forme<60)||(m.ecart21!==null&&m.ecart21>=10&&m.ecart21<20)||(m.var3!==null&&m.var3>=10&&m.var3<20)||entry.vals.some(v=>v===5)) return'jaune';
  return'vert';
}

// ═══════════════════════════════════════════════════════
//  ANALYSE CROISÉE WELLNESS ↔ BLESSURES
//  Pour chaque blessure, compare le Wellness du joueur dans les 7 jours précédents
//  à sa moyenne de référence sur le reste de la saison, pour voir si une dégradation
//  était visible avant la blessure.
// ═══════════════════════════════════════════════════════
function computeWellnessInjuryAnalysis(injuries,roster,wellnessSeries){
  const WINDOW_DAYS=7;
  const results=[];

  injuries.forEach(inj=>{
    if(!inj.date)return; // pas de date -> impossible de situer un "avant"
    const injDate=new Date(inj.date);
    if(isNaN(injDate))return;

    // Associe la blessure à un joueur du roster puis à sa série Wellness (par nom canonique/fuzzy)
    const player=roster.find(p=>{
      const xGen=parseInt(inj.gen)||null;
      const nameMatches=canonicalNameKey(p.name)===canonicalNameKey(inj.nom)||
        nameWords(inj.nom).some(w=>w.length>=3&&nameWords(p.name).includes(w));
      if(!nameMatches)return false;
      if(xGen&&p.gen&&xGen!==p.gen)return false;
      return true;
    });
    if(!player)return;

    // Retrouve sa série Wellness (clé = nom tel que résolu dans buildWellnessSeries)
    const seriesKey=Object.keys(wellnessSeries).find(n=>canonicalNameKey(n)===canonicalNameKey(player.name));
    const series=seriesKey?wellnessSeries[seriesKey]:null;
    if(!series||series.length<3){
      results.push({injury:inj,player,hasData:false});
      return;
    }

    const windowStart=new Date(injDate);windowStart.setDate(windowStart.getDate()-WINDOW_DAYS);
    const preEntries=series.filter(e=>{const d=new Date(e.date);return d>=windowStart&&d<injDate;});
    // Référence = le reste de la saison, hors fenêtre pré-blessure (pour ne pas se contaminer soi-même)
    const baselineEntries=series.filter(e=>{const d=new Date(e.date);return d<windowStart||d>=injDate;});

    if(preEntries.length<2||baselineEntries.length<3){
      results.push({injury:inj,player,hasData:false});
      return;
    }

    const avgScore=arr=>arr.reduce((a,e)=>a+e.score,0)/arr.length;
    const preScore=avgScore(preEntries);
    const baseScore=avgScore(baselineEntries);
    // Score Hooper : plus haut = pire. Delta positif = dégradation avant la blessure.
    const delta=preScore-baseScore;
    const degraded=delta>=2; // seuil : au moins 2 points Hooper de dégradation sur la somme des 5 indicateurs

    // Détail par indicateur, pour voir LEQUEL s'est dégradé
    const perIndicator=W_INDICATORS.map((ind,i)=>{
      const preAvg=preEntries.reduce((a,e)=>a+e.vals[i],0)/preEntries.length;
      const baseAvg=baselineEntries.reduce((a,e)=>a+e.vals[i],0)/baselineEntries.length;
      return{label:ind.label,icon:ind.icon,preAvg,baseAvg,delta:preAvg-baseAvg};
    });

    results.push({
      injury:inj,player,hasData:true,
      preScore,baseScore,delta,degraded,
      nbEntriesPre:preEntries.length,
      perIndicator:perIndicator.sort((a,b)=>b.delta-a.delta)
    });
  });

  const withData=results.filter(r=>r.hasData);
  const degradedCount=withData.filter(r=>r.degraded).length;
  // Compte, parmi les blessures précédées d'une dégradation, quel indicateur ressort le plus souvent en tête
  const topIndicatorCounts={};
  withData.filter(r=>r.degraded).forEach(r=>{
    const top=r.perIndicator[0];
    if(top&&top.delta>0.3)topIndicatorCounts[top.label]=(topIndicatorCounts[top.label]||0)+1;
  });
  const topIndicatorRanking=Object.entries(topIndicatorCounts).sort((a,b)=>b[1]-a[1]);

  return{
    results,
    total:injuries.length,
    withDataCount:withData.length,
    degradedCount,
    degradedPct:withData.length?Math.round(degradedCount/withData.length*100):null,
    topIndicatorRanking
  };
}

}

function svgGauge(forme,histLabel){
  // forme = état de forme (0-100+), right=green (good), left=red (bad)
  const pos=Math.max(0,Math.min(100,Math.round(parseFloat(forme)||50)));
  const W=190,H=110,cx=95,cy=102,r=80,ir=46;
  function pt(deg,rad){const a=deg*Math.PI/180;return[cx+rad*Math.cos(a),cy-rad*Math.sin(a)];}
  function ap(a1,a2,or,inr){
    const[x1,y1]=pt(a1,or),[x2,y2]=pt(a2,or),[x3,y3]=pt(a2,inr),[x4,y4]=pt(a1,inr);
    const lg=Math.abs(a1-a2)>180?1:0;
    return`M${x1},${y1} A${or},${or},0,${lg},0,${x2},${y2} L${x3},${y3} A${inr},${inr},0,${lg},1,${x4},${y4}Z`;
  }
  // Flipped: left=rouge/bad, right=vert/good
  // pos=0 → ndeg=180 (gauche=rouge), pos=100 → ndeg=0 (droite=vert)
  const ndeg=180-pos*1.8;
  const[nx,ny]=pt(ndeg,r*0.8);
  const[b1x,b1y]=pt(ndeg+90,8),[b2x,b2y]=pt(ndeg-90,8);
  const sc=pos>=80?'var(--alert-ok)':pos>=60?'var(--alert-ok)':pos>=40?'var(--alert-watch)':pos>=20?'var(--alert-warn)':'var(--alert-crit)';
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;">
    <!-- gauche=mauvais, droite=bon -->
    <path d="${ap(180,144,r,ir)}" fill="var(--alert-crit)"/>
    <path d="${ap(144,108,r,ir)}" fill="var(--alert-warn)"/>
    <path d="${ap(108,72,r,ir)}"  fill="var(--alert-watch)"/>
    <path d="${ap(72,36,r,ir)}"   fill="var(--alert-ok)"/>
    <path d="${ap(36,0,r,ir)}"    fill="var(--alert-ok)"/>
    <circle cx="${cx}" cy="${cy}" r="${ir}" fill="#111"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="900" fill="${sc}">${pos}%</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="8" fill="#555">état de forme</text>
    <polygon points="${nx},${ny} ${b1x},${b1y} ${b2x},${b2y}" fill="#fff" opacity="0.97"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="#ccc" stroke="#444" stroke-width="1"/>
    <text x="5" y="${H-2}" text-anchor="start" font-size="8" fill="var(--alert-crit)" font-weight="700">Mauvais</text>
    <text x="${W-5}" y="${H-2}" text-anchor="end" font-size="8" fill="var(--alert-ok)" font-weight="700">Optimal</text>
    ${histLabel?`<text x="${cx}" y="${H-2}" text-anchor="middle" font-size="7" fill="#444">${histLabel}</text>`:''}
  </svg>`;
}

  const dt=document.getElementById('wellnessDateText');
  if(dt) dt.textContent=fmtDMY(rpeDashDate);

  if(dp) dp.value=dateToKey(rpeDashDate);
}

function switchWellnessTab(t){wellnessTab=t;render();}

// Pour chaque joueur attendu, calcule son entrée du jour + toutes les métriques dérivées
function getDailyAssessments(allRows,dk){
  const series=buildWellnessSeries(allRows);
  const out=[];
  for(const name of Object.keys(series)){
    const s=series[name];
    const idx=s.findIndex(e=>e.date===dk);
    if(idx<0)continue;
    const m=computeMetricsAt(s,idx);
    const persistance=computePersistance(s,idx);
    const status=classifyStatus(m,s[idx],persistance);
    out.push({name,entry:s[idx],m,persistance,status,comment:statusComment(status,m,persistance)});
  }
  return out;
}

function renderWellnessBody(){
  if(!wellnessData)return`<div style="padding:20px;text-align:center;color:var(--text-muted);">⏳ Chargement...</div>`;
  if(wellnessData.error)return`<div style="padding:16px;color:#cc0000;text-align:center;">❌ ${wellnessData.error}<br><span style="font-size:11px;color:var(--text-muted);margin-top:6px;display:block;">Configure le script Wellness dans l'admin</span></div>`;
  const allRows=Array.isArray(wellnessData)?wellnessData.slice(1):[];
  const dk=dateToKey(rpeDashDate);
  const assessments=getDailyAssessments(allRows,dk);

  if(wellnessTab==='staff')return wTabStaff(assessments);
  if(wellnessTab==='moyennes')return wTabMoyennes(allRows,dk);
  if(wellnessTab==='evolution')return wTabEvolution(allRows,dk);
  if(wellnessTab==='legende')return wTabLegende();
  return wTabJoueurs(allRows,dk,assessments);
}

const W_DISPLAY_ORDER=[{idx:0,label:'Sommeil'},{idx:3,label:'Corb. haut'},{idx:2,label:'Corb. bas'},{idx:4,label:'Fatigue'},{idx:1,label:'Stress'}];

function indicatorAlert(entry){
  const[sommeil,stress,cbas,chaut,fatigue]=entry.vals;
  const checks=[{label:'Sommeil',val:sommeil,crit:true},{label:'Stress',val:stress,crit:true},{label:'Fatigue',val:fatigue,crit:true},{label:'Courb. bas',val:cbas,crit:false},{label:'Courb. haut',val:chaut,crit:false}];
  let best=null;
  for(const c of checks){
    let level=0,word='';
    if(c.crit){
      if(c.val===7){level=3;word='critique';}
      else if(c.val===6){level=2;word='discussion';}
      else if(c.val===5){level=1;word='vigilance';}
    } else {
      if(c.val===7){level=2;word='discussion';}
      else if(c.val===6){level=1;word='vigilance';}
    }
    if(level>0&&(!best||level>best.level)) best={...c,level,word};
  }
  if(!best)return null;
  return{icon:best.level===3?'🚨':best.level===2?'⚠':'👁',label:best.label,word:best.word,val:best.val};
}

function dayRange(endDateKey,n){
  const end=new Date(endDateKey+'T12:00:00');
  const days=[];
  for(let i=n-1;i>=0;i--) days.push(dateToKey(new Date(end.getTime()-i*86400000)));
  return days;
}

function closeIndicatorChart(){
  const m=document.getElementById('indChartModal');
  if(m)m.remove();
}

function showIndicatorChart(playerName,indIdx){
  if(!wellnessData||wellnessData.error)return;
  const allRows=Array.isArray(wellnessData)?wellnessData.slice(1):[];
  const series=(buildWellnessSeries(allRows)[playerName])||[];
  const dk=dateToKey(rpeDashDate);
  const days=dayRange(dk,30);
  const byDate={};series.forEach(e=>byDate[e.date]=e.vals[indIdx]);
  const pts=days.map(d=>({date:d,val:byDate[d]!==undefined?byDate[d]:null}));
  const valid=pts.filter(p=>p.val!==null).map(p=>p.val);
  const avg=valid.length?(valid.reduce((a,b)=>a+b,0)/valid.length):null;
  const min=valid.length?Math.min(...valid):null;
  const max=valid.length?Math.max(...valid):null;
  let lastVal=null;for(let i=pts.length-1;i>=0;i--){if(pts[i].val!==null){lastVal=pts[i].val;break;}}

  const ind=W_INDICATORS[indIdx];
  const label=ind.label;
  const photo=findWellnessPhoto(playerName);

  const W=600,H=240,padL=30,padR=14,padT=18,padB=30;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const n=pts.length;
  const xStep=innerW/(n-1);
  function xAt(i){return padL+i*xStep;}
  function yAt(v){return padT+innerH-((v-1)/6)*innerH;}

  let lineD='',areaD='',started=false,lastX=null;
  pts.forEach((p,i)=>{
    if(p.val===null)return;
    const x=xAt(i),y=yAt(p.val);
    if(!started){lineD+=`M${x},${y} `;areaD+=`M${x},${H-padB} L${x},${y} `;started=true;}
    else{lineD+=`L${x},${y} `;areaD+=`L${x},${y} `;}
    lastX=x;
  });
  if(lastX!==null) areaD+=`L${lastX},${H-padB} Z`;

  const lineColor=wIndColor(Math.round(avg||4));
  const dots=pts.map((p,i)=>p.val===null?'':`<circle cx="${xAt(i)}" cy="${yAt(p.val)}" r="3.5" fill="${wIndColor(p.val)}" stroke="#ffffff" stroke-width="1.2"/>`).join('');
  const xLabels=pts.map((p,i)=>{
    if(i%5!==0&&i!==n-1)return'';
    const d=new Date(p.date+'T12:00:00');
    return`<text x="${xAt(i)}" y="${H-padB+16}" font-size="9" fill="#666" text-anchor="middle">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</text>`;
  }).join('');
  const grid=[1,2,3,4,5,6,7].map(v=>`<line x1="${padL}" y1="${yAt(v)}" x2="${W-padR}" y2="${yAt(v)}" stroke="#1a1a1a" stroke-width="1"/><text x="${padL-7}" y="${yAt(v)+3}" font-size="9" fill="#555" text-anchor="end">${v}</text>`).join('');

  const html=`<div id="indChartModal" onclick="if(event.target.id==='indChartModal')closeIndicatorChart()" style="position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;">
    <div style="background:var(--surface);border-radius:16px;border:1px solid #222;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <button onclick="closeIndicatorChart()" style="position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;">✕</button>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
        ${photo?`<img src="${photo}" style="width:42px;height:42px;border-radius:8px;object-fit:cover;object-position:top;border:1.5px solid var(--border);">`:''}
        <div>
          <div style="font-size:16px;font-weight:800;color:var(--text);">${playerName}</div>
          <div style="font-size:12px;color:${lineColor};font-weight:700;">${label} — 30 derniers jours</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin:16px 0;">
        ${statBox('Dernier',lastVal!==null?`<span style="color:${wIndColor(lastVal)}">${lastVal}</span>`:'<span style="color:var(--text-muted);">—</span>','')}
        ${statBox('Moyenne',avg!==null?avg.toFixed(1):'<span style="color:var(--text-muted);">—</span>','')}
        ${statBox('Min',min!==null?`<span style="color:${wIndColor(min)}">${min}</span>`:'<span style="color:var(--text-muted);">—</span>','')}
        ${statBox('Max',max!==null?`<span style="color:${wIndColor(max)}">${max}</span>`:'<span style="color:var(--text-muted);">—</span>','')}
      </div>
      ${valid.length?`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--surface2);border-radius:10px;display:block;">
        ${grid}
        <path d="${areaD}" fill="${lineColor}22"/>
        <path d="${lineD}" fill="none" stroke="${lineColor}" stroke-width="2.5"/>
        ${dots}
        ${xLabels}
      </svg>
      <div style="display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;">
        ${[1,2,3,4,5,6,7].map(v=>`<div style="display:flex;align-items:center;gap:3px;"><div style="width:8px;height:8px;border-radius:50%;background:${wIndColor(v)};"></div><span style="font-size:9px;color:var(--text-muted);">${v}</span></div>`).join('')}
      </div>`:`<div style="padding:40px 0;text-align:center;color:var(--text-muted);font-size:13px;">Pas assez de données sur cette période.</div>`}
    </div>
  </div>`;

  closeIndicatorChart();
  const wrapper=document.createElement('div');
  wrapper.innerHTML=html;
  document.body.appendChild(wrapper.firstElementChild);
}

function wTabJoueurs(allRows,dk,assessments){
  // Les évaluations Wellness viennent d'un seul Google Sheet partagé entre toutes les équipes —
  // il faut donc les filtrer sur le roster de l'équipe actuellement sélectionnée, comme c'est déjà
  // fait pour la liste "N'ont pas répondu", sinon les réponses de toutes les équipes se mélangent.
  const rosterNames=getWellnessPlayers();
  assessments=assessments.filter(a=>rosterNames.some(wName=>{
    const anu=a.name.toUpperCase(),wnu=wName.toUpperCase();
    return canonicalNameKey(anu)===canonicalNameKey(wnu)||
      nameWords(anu).some(w=>w.length>=3&&nameWords(wnu).includes(w));
  }));

  const responded=new Set(assessments.map(a=>a.name.toUpperCase()));
  const missing=getWellnessPlayers().filter(wName=>![...responded].some(rn=>{
    const rnu=rn.toUpperCase(),wnu=wName.toUpperCase();
    return canonicalNameKey(rnu)===canonicalNameKey(wnu)||
      nameWords(rnu).some(w=>w.length>=3&&nameWords(wnu).includes(w));
  }));
  if(!assessments.length)return`<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">Aucune réponse Wellness ce jour.<br><span style="font-size:11px;color:var(--text-muted);">Les joueurs n'ont pas encore rempli le formulaire.</span></div>`;

  // Tri décroissant par sévérité : moins bonne forme = en premier
  const sorted=[...assessments].sort((a,b)=>a.m.forme-b.m.forme);

  return`
  ${missing.length?`<div style="padding:12px 14px;background:var(--primary-light);border-bottom:1px solid #2a1414;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span style="color:#cc6666;font-size:13px;">❌</span>
      <span style="font-size:12px;font-weight:700;color:#cc6666;text-transform:uppercase;letter-spacing:0.5px;">N'ont pas répondu</span>
      <span style="background:#2a1414;color:#cc6666;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;">${missing.length}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${missing.map(n=>`<span style="background:var(--primary-light);border:1px solid var(--primary-light);color:var(--primary-dark);padding:5px 12px;border-radius:14px;font-size:12px;">${n}</span>`).join('')}
    </div>
  </div>`:''}

  <div style="padding:10px 14px;background:var(--surface2);">
    <span style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Réponses reçues</span>
    <span style="background:var(--surface2);color:var(--text-muted);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;">${sorted.length}</span>
    <span style="font-size:10px;color:var(--text-muted);margin-left:8px;">· triés du moins bon au meilleur état de forme</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;padding:10px;">
  ${sorted.map(a=>wellnessPlayerCardHTML(a)).join('')}
  </div>`;
}

function wTabMoyennes(allRows,dk){
  const todayRows=allRows.filter(r=>wDateKey(r[0])===dk);
  const yKey=dateToKey(new Date(new Date(dk+'T12:00:00').getTime()-86400000));
  const yRows=allRows.filter(r=>wDateKey(r[0])===yKey);
  if(!todayRows.length)return`<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">Aucune donnée ce jour.</div>`;

  function avgFor(rows,i){
    const v=rows.map(r=>parseFloat(r[W_INDICATORS[i].col])).filter(v=>!isNaN(v));
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
  }

  return`
  <div style="padding:12px 14px;">
    <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px;">📊 Moyennes équipe du jour (1=Excellent · 7=Critique)</div>
    ${W_INDICATORS.map((ind,i)=>{
      const avg=avgFor(todayRows,i);
      const yAvg=avgFor(yRows,i);
      const trend=avg===null||yAvg===null?'→':avg>yAvg+0.3?'↗':avg<yAvg-0.3?'↘':'→';
      const trendColor=trend==='↗'?'#cc0000':trend==='↘'?'var(--alert-ok)':'#888';
      const pct=avg!==null?(avg/7*100):0;
      return`<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <span style="font-size:12px;color:var(--text);">${ind.label}</span>
          <span style="font-size:14px;font-weight:800;color:${avg!==null?wIndColor(Math.round(avg)):'#555'};">${avg!==null?avg.toFixed(2):'—'} <span style="font-size:12px;color:${trendColor};">${trend}</span></span>

// ── Onglet Évolution 30j ──────────────────────────────────────
function wTabEvolution(allRows,dk){
  const endDate=new Date(dk+'T12:00:00');
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(endDate.getTime()-i*86400000);
    days.push(dateToKey(d));
  }
  const series=days.map(day=>{
    const rows=allRows.filter(r=>wDateKey(r[0])===day);
    if(!rows.length)return null;
    const avgScore=rows.map(r=>W_INDICATORS.reduce((s,ind)=>s+(parseFloat(r[ind.col])||0),0)).reduce((a,b)=>a+b,0)/rows.length;
    const avgInd=W_INDICATORS.map((ind,i)=>{
      const v=rows.map(r=>parseFloat(r[ind.col])).filter(v=>!isNaN(v));
      return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
    });
    return{day,score:avgScore/2,vals:avgInd,n:rows.length};
  });

  const W=320,H=180,pad=24;
  const validPts=series.map((s,i)=>s?i:null).filter(i=>i!==null);
  const xStep=(W-pad*2)/29;
  function xAt(i){return pad+i*xStep;}
  function yAt(v,max){return H-pad-(v/max)*(H-pad*2);}

  const lines=[
    {key:'score',label:'Score (÷2)',color:'#fff',getVal:s=>s.score,max:17.5},
    {key:'sommeil',label:'Sommeil',color:'var(--ink-soft)',getVal:s=>s.vals[0],max:7},
    {key:'fatigue',label:'Fatigue',color:'#cc0000',getVal:s=>s.vals[4],max:7},
    {key:'stress',label:'Stress',color:'var(--alert-warn)',getVal:s=>s.vals[1],max:7},
    {key:'cbas',label:'Courb. bas',color:'var(--alert-ok)',getVal:s=>s.vals[2],max:7},
  ];

  const paths=lines.map(line=>{
    let d='';
    series.forEach((s,i)=>{
      if(!s)return;
      const v=line.getVal(s);
      if(v===null||v===undefined)return;
      const x=xAt(i),y=yAt(v,line.max);
      d+=(d===''?'M':'L')+x+','+y+' ';
    });
    return d?`<path d="${d}" fill="none" stroke="${line.color}" stroke-width="2"/>`:'';
  }).join('');

  const respondedTotal=series.filter(s=>s).length;

  return`
  <div style="padding:12px 14px;">
    <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:4px;">📈 Évolution wellness — 30 derniers jours</div>
    <div style="font-size:10px;color:var(--text-muted);margin-bottom:10px;">${respondedTotal} jour${respondedTotal>1?'s':''} avec réponse(s) sur 30</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--surface2);border-radius:8px;">
      ${[0,0.25,0.5,0.75,1].map(f=>`<line x1="${pad}" y1="${H-pad-f*(H-pad*2)}" x2="${W-pad}" y2="${H-pad-f*(H-pad*2)}" stroke="#1a1a1a" stroke-width="1"/>`).join('')}
      ${paths}
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
      ${lines.map(l=>`<div style="display:flex;align-items:center;gap:4px;"><div style="width:10px;height:3px;background:${l.color};"></div><span style="font-size:10px;color:var(--text-muted);">${l.label}</span></div>`).join('')}
    </div>
  </div>`;
}

function dedupeInjuries(){

// Normalise une chaîne pour comparaison insensible à la casse ET aux accents
// (le Sheet utilise parfois des accents mal placés, ex: "Bléssé" au lieu de "Blessé").
function normAccent(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

// Détermine le statut d'une blessure à partir du champ Étape.
// Valeurs exactes utilisées dans le menu déroulant du Google Sheet :
//   "Bléssé" -> blessé (indisponible)
//   "En phase de retour terrain" -> en réhabilitation (indisponible aussi)
//   "Retour au jeu" -> disponible
// Repli sur d'autres formulations proches si jamais le libellé diffère légèrement.
function injuryStepStatus(x){
  if(x.retour){
    const d=new Date(x.retour);
    if(!isNaN(d)&&d<=new Date())return'disponible';
  }
  const et=normAccent(x.etape);
  if(!et){
    // Aucune étape renseignée : suivi en direct (Sheet) -> présumée active ; historique -> présumée terminée.
    return x.source==='sheet'?'blesse':'disponible';
  }
  if(et.includes('retour au jeu')||et.includes('gueri')||et.includes('apte')||et.includes('disponible')||et.includes('termine')||et.includes('ras'))return'disponible';
  if(et.includes('retour terrain')||et.includes('reprise')||et.includes('progressiv')||et.includes('reathle')||et.includes('rehab'))return'rehabilitation';
  if(et.includes('bless')||et.includes('soin')||et.includes('cours')||et.includes('indispo'))return'blesse';
  return x.source==='sheet'?'blesse':'disponible';
}

function isInjuryOngoing(x){
  return injuryStepStatus(x)!=='disponible';
}

// Calcule la durée d'absence en jours si une date de retour est renseignée
function computeInjuryDuration(x){
  if(x.duree&&!isNaN(parseFloat(x.duree)))return parseFloat(x.duree);
  if(x.date&&x.retour){
    const d1=new Date(x.date),d2=new Date(x.retour);
    if(!isNaN(d1)&&!isNaN(d2)){
      const days=Math.round((d2-d1)/86400000);
      if(days>=0)return days;
    }
  }
  return null;
}

// Détermine le statut d'un joueur à partir de sa blessure la plus récente (par date).
function getPlayerInjuryStatus(playerName,playerGen){
  const ck=canonicalNameKey(playerName);
  const playerInjuries=injuriesDB.filter(x=>{
    const nameMatches=canonicalNameKey(x.nom)===ck||nameWords(x.nom).some(w=>w.length>=3&&nameWords(playerName).includes(w));
    if(!nameMatches)return false;
    // Si les deux générations sont connues et différentes -> ce n'est pas le même joueur (évite les confusions d'homonymes)
    const xGen=parseInt(x.gen)||null;
    if(playerGen&&xGen&&playerGen!==xGen)return false;
    return true;
  });
  if(!playerInjuries.length)return'disponible';
  const sorted=[...playerInjuries].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return injuryStepStatus(sorted[0]);
}

// ── Synchronisation avec le Google Sheet Blessures (2 onglets : Alamercery / Crabos) ──
// ── Parseur CSV simple (gère les champs entre guillemets, virgules, retours à la ligne internes) ──
function parseCSV(text){
  const rows=[];
  let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],next=text[i+1];
    if(inQuotes){
      if(c==='"'&&next==='"'){field+='"';i++;}
      else if(c==='"'){inQuotes=false;}
      else field+=c;
    } else {
      if(c==='"')inQuotes=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\r'){/* ignore */}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

// Traite les lignes d'un onglet (déjà parsées) et les fusionne dans injuriesDB, pour une équipe donnée
// Remplace entièrement les blessures "source=sheet" d'une équipe par le contenu ACTUEL de son onglet.
// Indispensable : si une ligne est supprimée/vidée dans le Google Sheet, elle doit disparaître
// de l'application aussi — un simple ajout/mise à jour ne suffit pas et fait s'accumuler des données obsolètes.
function mergeInjuryRows(rows,team){
  const freshEntries=[];
  if(rows&&rows.length>=2){
    const headerRow=rows[0];
    const cm=buildColMap(headerRow,INJURY_HEADER_MAP);
    for(const row of rows.slice(1)){
      const get=f=>cm[f]>=0?String(row[cm[f]]||'').trim():'';
      const nom=get('nom');
      if(!nom)continue;
      const date=normalizeInjuryDate(get('date'));
      const retour=normalizeInjuryDate(get('retour'));
      freshEntries.push({
        id:'sheet'+Date.now()+Math.random().toString(36).slice(2,6),
        nom:nom.toUpperCase().trim(),equipe:team,
        gen:get('gen'),poste:get('poste'),
        date,typo:get('typo'),type:get('type'),
        loc:get('loc'),lieu:get('lieu'),
        gravite:get('gravite'),etape:get('etape'),
        duree:get('duree'),retour,commentaire:get('commentaire'),
        source:'sheet'
      });
    }
  }
  // Retire toutes les anciennes entrées "sheet" de cette équipe, remplace par les fraîches
  const before=injuriesDB.length;
  injuriesDB=injuriesDB.filter(x=>!(x.source==='sheet'&&x.equipe===team));
  const removed=before-injuriesDB.length;
  injuriesDB.push(...freshEntries);
  return{added:freshEntries.length,removed,total:freshEntries.length};
}

  if(st&&!silent)st.innerHTML='<span style="color:var(--text-muted);">⏳ Synchronisation...</span>';

      const resp=await fetch(url,{cache:'no-cache'});

    }catch(err){

    }
  }

    if(st)st.innerHTML=`<span style="color:var(--primary-dark);">${msg}</span>`;

    if(st)st.innerHTML=`<span style="color:var(--alert-ok);font-weight:600;">${msg}</span>`;
    else if(!silent)alert(msg);
  }

}

// Normalise une date venant de n'importe quelle source (Apps Script, CSV) vers le format AAAA-MM-JJ,
// que ce soit du JJ/MM/AAAA classique ou un ISO complet type "2026-08-08T22:00:00.000Z".
function normalizeInjuryDate(raw){
  if(!raw)return'';
  const s=String(raw).trim();
  // ISO complet (avec ou sans heure) : on garde juste la partie date
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // JJ/MM/AAAA (année sur 4 chiffres)
  const m4=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m4)return`${m4[3]}-${m4[2].padStart(2,'0')}-${m4[1].padStart(2,'0')}`;
  // JJ/MM/AA (année sur 2 chiffres seulement, ex: "09/08/26") -> on préfixe par 20
  const m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if(m2)return`20${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  // Texte non reconnu comme une date (ex: quelqu'un a tapé "Arrivé blessé" dans la cellule Date par erreur)
  // -> on renvoie vide plutôt que le texte brut, pour éviter d'afficher un fragment tronqué ailleurs.
  return'';
}
